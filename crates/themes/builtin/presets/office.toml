    { title = "업무 분야 둘", text = "근로계약, 임금, 퇴사 정리처럼 사람을 쓰는 일의 노무를 돕습니다.", link = "/b/column?f.area=b" },
    { title = "업무 분야 셋", text = "장부 정리와 세금 신고, 기한 관리를 맡아 사업에 집중하시도록 돕습니다.", link = "/b/column?f.area=c" },
  ] } },
  { kind = "features", region = "main", scope = "home", title = "상담 절차", config = { style = "steps", tone = "soft", items = [
