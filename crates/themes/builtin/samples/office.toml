# 전문 사무소 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 칼럼은 일반적인 안내일 뿐 법률·세무 자문이 아니다.

[[ops]]
op = "posts.ensure"
board = "column"

[[ops.items]]
title = "계약서에 서명하기 전에 꼭 읽어 볼 부분"
image = "desk"
alt = "계약서를 살펴보는 책상 예시 그림"
meta = { area = "a" }
body_md = """
계약서는 다 읽고 서명하는 것이 원칙이지만, 바쁠 때는 앞장만 보고 넘기기 쉽습니다. 나중에 다툼이 생기는 곳은 대개 뒷장에 있습니다.

## 먼저 볼 곳

- 계약을 끝낼 수 있는 조건과 그때 돌려받는 돈
- 일이 늦어졌을 때 누가 어떤 책임을 지는지
- 다툼이 생기면 어디서 해결하기로 했는지

모르는 말이 있으면 서명하기 전에 상대에게 뜻을 물어 적어 두는 것이 좋습니다.

개별 사안은 상담으로 확인하세요.
"""

[[ops.items]]
title = "내용증명은 언제 보내는 것이 좋을까요"
meta = { area = "a" }
body_md = """
내용증명은 어떤 내용을 언제 상대에게 알렸는지 남겨 두는 우편입니다. 그 자체로 상대에게 무엇을 강제하지는 않습니다.

돈을 돌려 달라고 요구하거나 계약을 끝내겠다고 알릴 때처럼, 알린 날짜가 중요한 경우에 많이 씁니다. 감정을 담은 표현보다는 사실과 요구 사항을 짧게 적는 편이 낫습니다.

보내기 전에 지금까지 주고받은 문자와 메일을 날짜순으로 정리해 두세요.

개별 사안은 상담으로 확인하세요.
"""

[[ops.items]]
title = "직원을 처음 뽑을 때 챙길 서류"
image = "people"
alt = "함께 일하는 사람들 예시 그림"
meta = { area = "b" }
body_md = """
처음 직원을 뽑는 사업장에서 가장 자주 놓치는 것이 근로계약서입니다. 일을 시작하는 날 서로 서명하고 한 부씩 나눠 갖는 것이 좋습니다.

## 계약서에 적을 것

- 일하는 날과 시간, 쉬는 시간
- 임금과 지급일, 지급 방법
- 휴일과 휴가

짧게 일하는 직원이라도 같습니다. 바뀐 내용이 생기면 그때마다 새로 쓰거나 고친 내용을 서로 확인해 두세요.

개별 사안은 상담으로 확인하세요.
"""

[[ops.items]]
title = "퇴사하는 직원과 마무리할 일"
meta = { area = "b" }
body_md = """
직원이 그만둘 때는 마지막 근무일을 서로 분명히 정하고, 남은 임금과 정산할 돈을 언제 줄지 미리 알려 주는 것이 좋습니다.

회사 물건과 계정 반납, 인수인계 범위도 정해 두면 뒤에 서운한 일이 줄어듭니다. 사직서는 날짜를 적어 받아 두세요.

정산 금액은 근무 기간과 계약 내용에 따라 달라집니다.

개별 사안은 상담으로 확인하세요.
"""

[[ops.items]]
title = "작은 가게의 장부, 이것만은 남겨 두세요"
image = "desk"
alt = "장부와 영수증이 놓인 책상 예시 그림"
meta = { area = "c" }
body_md = """
처음 가게를 연 분들은 매출보다 지출 기록을 놓치는 경우가 많습니다. 쓴 돈의 증빙이 없으면 나중에 비용으로 인정받기 어려울 수 있습니다.

- 카드 영수증과 계산서는 달마다 한 봉투에 모읍니다.
- 개인 돈과 가게 돈은 통장을 나눠 씁니다.
- 현금으로 쓴 돈은 그날 바로 적어 둡니다.

기록이 쌓이면 신고할 때 걸리는 시간도 훨씬 줄어듭니다.

개별 사안은 상담으로 확인하세요.
"""

[[ops.items]]
title = "신고 기한을 놓치지 않는 방법"
meta = { area = "c" }
body_md = """
사업을 하면 해마다 돌아오는 신고와 납부 기한이 여러 번 있습니다. 기한을 넘기면 더 내야 할 돈이 생길 수 있습니다.

달력에 신고 달을 미리 적어 두고, 기한 한 달 전에는 자료를 모으기 시작하세요. 사무소에 맡기신 분께는 기한 전에 필요한 자료 목록을 먼저 보내 드립니다.

업종과 사업 규모에 따라 챙겨야 할 신고가 다릅니다.

개별 사안은 상담으로 확인하세요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "사무소 홈페이지를 열었습니다"
notice = true
body_md = """
사무소 홈페이지를 열었습니다. 맡는 일은 [업무 분야](/p/practice)에서, 함께 일하는 사람은 [구성원](/p/people)에서 보실 수 있습니다.

상담을 원하시면 [상담 신청](/p/consult)에 일의 개요를 남겨 주세요. 담당자가 영업일 안에 연락드립니다.
"""

[[ops.items]]
title = "연말 상담 일정 안내"
body_md = """
연말에는 상담 신청이 몰려 일정 잡기가 조금 늦어질 수 있습니다.

- 평일 상담: 오전 10시부터 오후 6시까지
- 토요일 상담: 미리 신청하신 분만

급한 일은 신청서에 급한 까닭을 함께 적어 주시면 먼저 연락드리겠습니다.
"""

[[ops.items]]
title = "새해 연휴 휴무 안내"
body_md = """
새해 연휴 동안 사무소를 쉽니다. 연휴 중 남겨 주신 상담 신청은 연휴가 끝난 다음 날부터 차례로 연락드립니다.
"""
