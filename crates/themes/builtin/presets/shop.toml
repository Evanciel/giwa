# 쇼핑몰 진열형 (ADR-0139). 상품은 게시판 글이고 분류·가격·품절·구매 링크 칸을 쓴다.
# 결제·장바구니는 범위 밖이다. 구매는 구매 링크(바깥 스토어)나 문의로 받는다. 글자는 예시다.
# 바닥글의 사업자 정보 자리는 통신판매업자가 흔히 보이는 항목이다. 운영자가 실제 정보로 바꾼다.
id = "shop"
name = "쇼핑몰"
description = "상품 진열(분류·가격·품절), 후기, 주문·배송 안내, 문의, 바닥글 사업자 정보"
theme_note = "산뜻한 흰 바탕에 라즈베리색, 사진이 돋보이는 넓은 폭"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fdfcfc", fg = "#1c1a1e", primary = "#b4235a", muted = "#5e5960", surface = "#ffffff", border = "#ece6ea" }, color_dark = { bg = "#151316", fg = "#f2edf1", primary = "#f29bbb", muted = "#aba3aa", surface = "#1e1b1f", border = "#332e34" }, radius = { sm = 6, md = 12, lg = 18 }, layout = { max_width = 1240 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "products"
name = "상품"
kind = "gallery"
layout = "gallery"
sort_order = 0
policy = { write = "editor", comment = "none" }
field_schema = [
  { key = "category", label = "분류", type = "select", list = true, filter = true, options = [{ value = "new", label = "새 상품" }, { value = "best", label = "많이 찾는 상품" }, { value = "set", label = "선물 세트" }, { value = "sale", label = "할인" }] },
  { key = "price", label = "가격", type = "text", list = true, help = "예: 12,000원" },
  { key = "soldout", label = "품절", type = "boolean", list = true, filter = true },
  { key = "buy", label = "구매 링크", type = "url", help = "바깥 스토어의 상품 주소. 비우면 문의로 받습니다." },
]

[[ops]]
op = "board.ensure"
slug = "reviews"
name = "구매 후기"
kind = "gallery"
layout = "card"
sort_order = 1
policy = { write = "member", comment = "member" }

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지"
kind = "notice"
sort_order = 2

[[ops]]
op = "board.ensure"
slug = "stories"
name = "룩북·이야기"
kind = "gallery"
layout = "gallery"
sort_order = 3
policy = { write = "editor", comment = "member" }

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "guide"
title = "주문·배송 안내"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "stores"
title = "매장 안내"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "contact"
title = "문의"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { home_page = "home", show_search = true }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "상품", link = { kind = "board", slug = "products" } },
  { label = "룩북·이야기", link = { kind = "board", slug = "stories" } },
  { label = "구매 후기", link = { kind = "board", slug = "reviews" } },
  { label = "주문·배송 안내", link = { kind = "page", slug = "guide" } },
  { label = "매장 안내", link = { kind = "page", slug = "stores" } },
  { label = "공지", link = { kind = "board", slug = "notice" } },
  { label = "문의", link = { kind = "page", slug = "contact" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "이번 철에는 손에 익는 린넨과 도자기를 골랐습니다", button = { label = "상품 보기", link = "/b/products" }, button2 = { label = "주문·배송 안내", link = "/p/guide" } } },
  { kind = "notice_bar", region = "header", scope = "all", config = { text = "5만 원 이상 주문하면 배송비가 없습니다", link = "/p/guide" } },
  { kind = "features", region = "main", scope = "home", config = { style = "tiles", items = [
    { title = "전체 상품", link = "/b/products" },
    { title = "새 상품", text = "이번에 들어온 상품", link = "/b/products?f.category=new" },
    { title = "많이 찾는 상품", text = "다시 찾는 분이 많은 상품", link = "/b/products?f.category=best" },
    { title = "선물 세트", text = "포장해서 보내 드립니다", link = "/b/products?f.category=set" },
    { title = "할인", text = "값을 내린 상품", link = "/b/products?f.category=sale" },
    { title = "룩북·이야기", text = "상품을 만든 이야기", link = "/b/stories" },
  ] } },
  { kind = "gallery_grid", region = "main", scope = "home", title = "상품", config = { board = "products", limit = 8, columns = 4 } },
  { kind = "latest_posts", region = "main", scope = "home", title = "룩북·이야기", config = { board = "stories", limit = 3, view = "card" } },
  { kind = "features", region = "main", scope = "home", title = "주문 전에 확인해 주세요", config = { style = "rows", items = [
    { title = "배송", text = "평일 오후 2시까지 주문하면 그날 보냅니다. 배송비는 3,000원입니다." },
    { title = "교환·반품", text = "받은 날부터 7일 안에 문의로 알려 주세요." },
    { title = "주문 방법", text = "상품마다 있는 구매 링크나 문의로 주문을 받습니다." },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "구매 후기", config = { board = "reviews", limit = 4, view = "card" } },
  { kind = "latest_posts", region = "main", scope = "home", title = "공지", config = { board = "notice", limit = 4 } },
  { kind = "hero", region = "main", scope = "page:guide", config = { title = "주문·배송 안내", text = "주문부터 받기까지, 교환과 반품 방법을 안내합니다." } },
  { kind = "features", region = "main", scope = "page:guide", title = "주문 순서", config = { style = "steps", items = [
    { title = "상품 고르기", text = "상품 글에서 가격과 품절을 확인합니다." },
    { title = "주문", text = "구매 링크로 주문하거나 문의를 남깁니다." },
    { title = "보내기", text = "주문을 확인하면 보내고 송장 번호를 알려 드립니다." },
  ] } },
  { kind = "faq", region = "main", scope = "page:guide", title = "자주 묻는 질문", config = { tone = "soft", items = [
    { q = "배송은 며칠 걸리나요?", a = "보낸 날부터 보통 1~2일 걸립니다. 도서·산간 지역은 더 걸릴 수 있습니다." },
    { q = "교환이나 반품은 어떻게 하나요?", a = "받은 날부터 7일 안에 문의로 주문한 이름과 까닭을 알려 주세요. 다시 보낼 주소를 안내합니다." },
    { q = "품절 상품은 다시 들어오나요?", a = "다시 들어오면 공지에 알립니다." },
  ] } },
  { kind = "hero", region = "main", scope = "page:stores", config = { title = "매장 안내", text = "상품을 직접 보고 만져 보며 고를 수 있는 매장입니다. 편하게 들러 주세요." } },
  { kind = "hours", region = "main", scope = "page:stores", title = "영업시간", config = { rows = [
    { days = "월~금", time = "10:00~19:00" },
    { days = "토·일", time = "11:00~18:00" },
  ], note = "공휴일 영업은 공지로 알립니다." } },
  { kind = "visit", region = "main", scope = "page:stores", title = "오시는 길", config = { name = "매장 이름", address = "주소를 적어 주세요", phone = "000-0000-0000", parking = "매장 전용 주차장이 없어 가까운 공영주차장을 이용해 주세요." } },
  { kind = "hero", region = "main", scope = "page:contact", config = { title = "문의", text = "주문, 배송, 교환·반품 무엇이든 남겨 주세요." } },
  { kind = "contact_form", region = "main", scope = "page:contact", config = { form = "contact", purpose = "주문·문의 답변", fields = [
    { key = "name", label = "이름", required = true },
    { key = "contact", label = "연락처", type = "tel", required = true },
    { key = "topic", label = "문의 종류", type = "select", required = true, options = ["주문", "배송", "교환·반품", "그 밖의 문의"] },
    { key = "message", label = "내용", type = "textarea", required = true, help = "주문한 상품이 있으면 상품 이름을 함께 적어 주세요." },
  ] } },
  { kind = "markdown_block", region = "footer", scope = "all", config = { body = "상호 가게 이름 · 대표자 이름을 적어 주세요 · 주소를 적어 주세요\n\n전화 000-0000-0000 · 사업자등록번호 000-00-00000 · 통신판매업 신고번호 제0000-지역-0000호" } },
]
