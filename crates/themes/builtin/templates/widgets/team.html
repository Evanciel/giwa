<ul class="team-list">
  {% for i in w.data.items %}<li>
    {% if i.image %}<img src="{{ i.image.src }}" srcset="{{ i.image.srcset }}" sizes="(min-width: 760px) 240px, 50vw" width="{{ i.image.width }}" height="{{ i.image.height }}" alt="" loading="lazy"{{ edit_image("items." ~ loop.index0 ~ ".image") }}>{% elif w.edit_id %}<div class="maru-img-empty maru-img-face"{{ edit_image("items." ~ loop.index0 ~ ".image") }}>{{ "사진 넣기"|t }}</div>{% endif %}
    <p class="team-name"{% if not i.link %}{{ edit_field("items." ~ loop.index0 ~ ".name") }}{% endif %}>{% if i.link %}<a href="{{ i.link.href }}"{% if i.link.external %} rel="noopener noreferrer"{% endif %}{{ edit_field("items." ~ loop.index0 ~ ".name") }}>{{ i.name }}</a>{% else %}{{ i.name }}{% endif %}</p>
    {% if i.role %}<p class="team-role"{{ edit_field("items." ~ loop.index0 ~ ".role") }}>{{ i.role }}</p>{% endif %}
    {% if i.bio %}<p class="team-bio"{{ edit_field("items." ~ loop.index0 ~ ".bio") }}>{{ i.bio }}</p>{% endif %}
  </li>{% endfor %}
</ul>
