# 동호회·모임 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 모임 일정·장소·회비는 예시다.

[[ops]]
op = "posts.ensure"
board = "meetups"

[[ops.items]]
title = "12월 정기 모임: 한 해 돌아보기"
image = "people"
alt = "정기 모임 예시 그림"
meta = { kind = "regular", date = "2026-12-12", deadline = "2026-12-08", place = "모임 공간 (신청자에게 안내)", fee = "15,000원", seats = 20 }
body_md = """
올해 마지막 정기 모임입니다. 한 해 동안의 활동 사진을 함께 보고, 내년에 하고 싶은 것을 나눕니다.

- 저녁 식사를 함께합니다 (참가비에 포함)
- 작은 선물 교환이 있습니다 (1만 원 안쪽)

참석은 댓글로 남겨 주세요. 자리가 차면 마감합니다.
"""

[[ops.items]]
title = "토요일 아침 공원 걷기 번개"
image = "landscape"
alt = "공원 산책 예시 그림"
meta = { kind = "flash", date = "2026-11-21", deadline = "2026-11-20", place = "동네 공원 입구", fee = "없음", seats = 10 }
body_md = """
날씨가 좋아서 번개 모임을 엽니다. 공원을 한 바퀴 천천히 걷고 근처에서 따뜻한 차 한잔해요.

편한 신발만 챙겨 오시면 됩니다. 비가 오면 모임은 취소하고 공지로 알려 드립니다.
"""

[[ops.items]]
title = "원데이 클래스: 손으로 만드는 연말 카드"
image = "desk"
alt = "카드 만들기 예시 그림"
meta = { kind = "oneday", date = "2026-12-19", deadline = "2026-12-13", place = "공방 (신청자에게 안내)", fee = "25,000원", seats = 8 }
body_md = """
처음 해 보는 분도 따라 할 수 있는 연말 카드 만들기 시간입니다. 재료는 모두 준비해 둡니다.

두 시간 동안 카드 세 장을 만들어 갑니다. 손이 많이 가는 작업이라 인원을 여덟 명으로 정했습니다.
"""

[[ops.items]]
title = "1월 정기 모임: 새해 계획 나누기"
image = "people"
alt = "새해 모임 예시 그림"
meta = { kind = "regular", date = "2027-01-16", deadline = "2027-01-12", place = "모임 공간 (신청자에게 안내)", fee = "10,000원", seats = 20 }
body_md = """
새해 첫 정기 모임입니다. 올해 모임에서 함께해 보고 싶은 활동을 모아 일정을 짭니다.

새로 가입한 회원도 편하게 오세요. 처음 오신 분은 짧게 자기소개를 부탁드립니다.
"""

[[ops.items]]
title = "11월 정기 모임 (마감)"
image = "people"
alt = "지난 정기 모임 예시 그림"
meta = { kind = "regular", date = "2026-11-07", deadline = "2026-11-03", place = "모임 공간", fee = "10,000원", seats = 20 }
body_md = """
신청을 마감한 지난 정기 모임입니다. 함께해 주신 분들 고맙습니다.

모임 사진은 [활동 사진](/b/photos) 게시판에 올려 두었습니다.
"""

[[ops]]
op = "posts.ensure"
board = "photos"

[[ops.items]]
title = "가을 정기 모임 단체 사진"
image = "people"
alt = "단체 사진 예시 그림"
body_md = """
가을 정기 모임에서 함께 찍은 사진입니다. 오랜만에 많은 분이 모였어요.
"""

[[ops.items]]
title = "산책길 단풍"
image = "landscape"
alt = "단풍길 예시 그림"
body_md = """
번개 모임 때 걸었던 산책길입니다. 단풍이 한창이었습니다.
"""

[[ops.items]]
title = "모임 끝나고 먹은 저녁"
image = "food"
alt = "저녁 식사 예시 그림"
body_md = """
모임 끝나고 다 같이 먹은 저녁입니다. 다음에도 이 집 가요.
"""

[[ops.items]]
title = "원데이 클래스 결과물"
image = "still"
alt = "만든 작품 예시 그림"
body_md = """
원데이 클래스에서 만든 작품들을 한자리에 모아 봤습니다. 다들 솜씨가 좋으세요.
"""

[[ops.items]]
title = "모임 공간 준비하는 중"
image = "room"
alt = "모임 공간 예시 그림"
body_md = """
정기 모임 전에 운영진이 자리를 꾸미는 모습입니다. 일찍 와서 도와주신 회원님 고맙습니다.
"""

[[ops.items]]
title = "도시 야경 걷기"
image = "city"
alt = "야경 예시 그림"
body_md = """
저녁 번개로 다녀온 야경 걷기입니다. 바람은 찼지만 불빛이 예뻤어요.
"""

[[ops.items]]
title = "첫 모임 날 자기소개 시간"
image = "people"
alt = "자기소개 시간 예시 그림"
body_md = """
처음 오신 분들이 자기소개하는 모습입니다. 금방 친해지셨어요.
"""

[[ops.items]]
title = "모임 기념 스티커"
image = "abstract"
alt = "기념 스티커 예시 그림"
body_md = """
모임 이름을 넣어 만든 기념 스티커입니다. 정기 모임에 오시면 나눠 드려요.
"""

[[ops]]
op = "posts.ensure"
board = "hello"

[[ops.items]]
title = "안녕하세요, 이번 주에 가입했어요"
body_md = """
동네에서 함께 걸을 분들을 찾다가 가입했습니다. 아직 낯설지만 번개 모임부터 나가 보려고 해요.

잘 부탁드립니다!
"""

[[ops.items]]
title = "친구 소개로 들어왔습니다"
body_md = """
친구가 모임 이야기를 자주 해서 저도 가입했어요. 원데이 클래스에 관심이 많습니다.

다음 모임에서 뵐게요.
"""

[[ops.items]]
title = "이사 와서 동네 친구를 찾고 있어요"
body_md = """
지난달에 이 동네로 이사 왔습니다. 아는 사람이 없어 심심하던 차에 모임을 알게 되었어요.

주말 아침 모임이면 거의 다 나갈 수 있습니다. 반갑게 맞아 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "members"

[[ops.items]]
title = "다음 원데이 클래스로 뭘 하면 좋을까요?"
body_md = """
다음 원데이 클래스 주제를 정하려고 합니다. 해 보고 싶은 것을 댓글로 남겨 주세요.

지금까지 나온 의견은 향초 만들기, 도자기 체험, 사진 찍기 기초입니다.
"""

[[ops.items]]
title = "지난 모임 사진 원본 필요하신 분"
body_md = """
지난 정기 모임 때 찍은 사진 원본이 있어요. 필요하신 분은 댓글 남겨 주시면 따로 보내 드릴게요.

얼굴이 나온 사진은 본인에게만 보냅니다.
"""

[[ops.items]]
title = "번개 모임 열고 싶은데 어떻게 하나요?"
body_md = """
회원도 번개를 열 수 있다고 들었는데, 운영진께 먼저 말씀드리면 되나요?

날짜와 장소를 정해서 이 게시판에 올리면 운영진이 모임 일정에 옮겨 준다고 공지에서 본 것 같아요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "모임에 오신 것을 환영합니다"
notice = true
body_md = """
처음 오신 분은 [모임 안내](/p/about)에서 모임 방식과 회칙을 먼저 읽어 주세요.

가입은 [가입 신청](/p/join)에 간단한 소개를 남기면 운영진이 확인하고 연락드립니다. 가입한 뒤에는 [가입 인사](/b/hello)에 인사 한마디 남겨 주세요.
"""

[[ops.items]]
title = "회원도 번개 모임을 열 수 있습니다"
body_md = """
가고 싶은 곳이 있으면 누구나 번개 모임을 열 수 있습니다.

1. [회원 게시판](/b/members)에 날짜, 장소, 인원을 적어 올립니다
2. 운영진이 확인하고 [모임 일정](/b/meetups)에 올립니다

참가비가 있는 모임은 운영진과 먼저 이야기해 주세요.
"""

[[ops.items]]
title = "내년 회비 안내"
body_md = """
내년 회비는 한 해 30,000원입니다. 모임 공간 대여와 기념품, 연말 모임 준비에 씁니다.

회비를 어떻게 썼는지는 해마다 연말 정기 모임에서 알려 드립니다.
"""
