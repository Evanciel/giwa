# 채용 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 회사·자리·조건은 모두 예시다.

[[ops]]
op = "posts.ensure"
board = "jobs"

[[ops.items]]
title = "웹 서비스 개발자 (경력)"
image = "desk"
alt = "모니터가 놓인 책상 예시 그림"
meta = { team = "dev", kind = "full", deadline = "2026-12-20" }
body_md = """
예시 공고입니다. 작은 팀에서 웹 서비스를 처음부터 끝까지 함께 만들 개발자를 찾습니다.

## 하는 일

- 서비스 화면과 서버 기능 만들기
- 고객 의견을 듣고 고칠 곳 정하기

## 이런 분을 찾습니다

- 웹 서비스를 직접 만들어 운영해 본 분
- 결정한 까닭을 글로 남기는 데 익숙한 분

지원은 [지원하기](/p/apply)에서 받습니다.
"""

[[ops.items]]
title = "서버 개발자 (신입 가능)"
meta = { team = "dev", kind = "full", deadline = "2027-01-15" }
body_md = """
예시 공고입니다. 경력이 없어도 괜찮습니다. 배우는 속도와 꾸준함을 더 중요하게 봅니다.

- 입사 후 석 달 동안 선배 개발자와 짝을 지어 일합니다.
- 교육비와 책값을 지원합니다.

직접 만들어 본 것이 있으면 저장소 주소를 함께 적어 주세요.
"""

[[ops.items]]
title = "제품 디자이너"
image = "abstract"
alt = "화면 설계를 나타낸 추상 예시 그림"
meta = { team = "design", kind = "full", deadline = "2027-01-31" }
body_md = """
예시 공고입니다. 사용자가 헤매지 않는 화면을 함께 고민할 디자이너를 찾습니다.

## 하는 일

- 새 기능의 흐름과 화면 설계
- 사용자 인터뷰 준비와 정리

포트폴리오에는 결과 화면보다 왜 그렇게 정했는지가 보이면 좋습니다.
"""

[[ops.items]]
title = "그래픽 디자이너 (6개월 계약)"
meta = { team = "design", kind = "contract", deadline = "2026-12-31" }
body_md = """
예시 공고입니다. 새해 홍보물과 소개 자료를 맡아 주실 분을 여섯 달 계약으로 모십니다.

- 근무: 주 5일, 핵심 근무 시간 오전 11시부터 오후 4시
- 계약이 끝난 뒤 함께 정규직 전환을 이야기할 수 있습니다.
"""

[[ops.items]]
title = "고객 지원 담당자"
image = "people"
alt = "상담하는 사람들 예시 그림"
meta = { team = "ops", kind = "full", deadline = "2027-02-14" }
body_md = """
예시 공고입니다. 고객의 문의에 답하고, 자주 들어오는 질문을 정리해 서비스를 고치는 데 보태 주실 분을 찾습니다.

## 이런 분과 맞습니다

- 상대가 무엇을 원하는지 끝까지 듣는 분
- 같은 질문이 반복되면 문서로 남기는 분
"""

[[ops.items]]
title = "운영 지원 인턴 (3개월)"
meta = { team = "ops", kind = "intern", deadline = "2027-01-10" }
body_md = """
예시 공고입니다. 일정 관리, 자료 정리, 행사 준비를 함께할 인턴을 석 달 동안 모십니다.

- 담당자가 매주 한 번 함께 돌아보는 시간을 가집니다.
- 활동비를 지급하고, 마칠 때 경험 확인서를 드립니다.
"""

