# 학원 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 수업 내용·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "news"

[[ops.items]]
title = "초등 반, 분수 개념을 그림으로 익혔어요"
image = "desk"
alt = "초등 반 수업 예시 그림"
body_md = """
이번 주 초등 반은 분수를 처음 배우는 단원이었습니다. 숫자부터 외우기보다 피자와 색종이를 나누어 보며 '전체 중 얼마'라는 뜻을 먼저 잡았습니다.

- 색종이를 접어 2분의 1, 4분의 1 만들기
- 같은 크기끼리 견주어 보기
- 오늘 배운 것을 한 문장으로 말해 보기

다음 주에는 크기가 같은 분수를 이어서 배웁니다. 숙제는 교재 두 쪽입니다.
"""

[[ops.items]]
title = "중등 반 단원 평가를 마쳤습니다"
image = "desk"
alt = "단원 평가 예시 그림"
body_md = """
중등 반이 일차함수 단원 평가를 마쳤습니다. 점수보다 어디서 막혔는지를 보려고 보는 평가입니다.

틀린 문제는 학생마다 오답 노트에 옮겨 적고, 다음 수업 앞 20분 동안 함께 다시 풉니다. 학생별 결과는 학부모님께 따로 문자로 알려 드립니다.
"""

[[ops.items]]
title = "고등 반 주말 자습실을 열었습니다"
image = "room"
alt = "자습실 예시 그림"
body_md = """
시험 기간을 앞두고 고등 반 학생을 위해 주말에도 자습실을 엽니다.

- 토요일·일요일 13:00 ~ 18:00
- 강사 한 명이 자리에 있어 질문을 받습니다
- 자리는 먼저 오는 순서대로 앉습니다

휴대폰은 들어올 때 보관함에 넣어 두고, 나갈 때 찾아갑니다.
"""

[[ops.items]]
title = "책 읽고 이야기 나누는 시간"
image = "people"
alt = "독서 토론 수업 예시 그림"
body_md = """
한 달에 한 번, 반마다 짧은 글을 함께 읽고 생각을 나누는 시간을 갖습니다. 이번 달은 '친구와 다툰 날'을 주제로 한 짧은 이야기를 읽었습니다.

말하기를 어려워하던 학생도 짝과 먼저 이야기한 뒤에는 손을 들어 발표했습니다. 쓰기 활동지는 다음 주에 집으로 보내 드립니다.
"""

[[ops.items]]
title = "새 교재가 들어왔습니다"
image = "still"
alt = "새 교재 예시 그림"
body_md = """
다음 학기에 쓸 교재가 들어왔습니다. 반마다 수준에 맞는 교재를 강사들이 함께 골랐습니다.

교재는 수업 첫날 나누어 주며, 교재비는 다음 달 교습비 안내 때 함께 알려 드립니다. 이미 같은 교재를 가진 학생은 미리 말씀해 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "겨울 학기 수강 신청 안내"
notice = true
body_md = """
겨울 학기 수업은 12월 첫 주에 시작합니다. 지금 다니는 학생은 같은 반으로 이어서 등록되며, 반을 바꾸고 싶으면 이번 달 안에 알려 주세요.

## 새로 오는 학생

상담과 레벨 테스트를 먼저 받습니다. [상담 신청](/p/consult)에 학년과 원하는 날짜를 남겨 주시면 연락드립니다.

반별 시간표와 수강료는 [강좌 안내](/p/classes)에 있습니다.
"""

[[ops.items]]
title = "학부모 상담 주간 안내"
body_md = """
다음 달 둘째 주는 학부모 상담 주간입니다. 담당 강사가 학생의 수업 태도와 숙제, 앞으로의 계획을 말씀드립니다.

- 방문 상담 또는 전화 상담 중 고를 수 있습니다
- 한 학생당 20분 안팎입니다

원하는 요일과 시간을 문자로 보내 주시면 순서대로 잡아 드립니다.
"""

[[ops.items]]
title = "공휴일 휴강과 보강 안내"
body_md = """
공휴일에는 모든 반이 쉽니다. 쉬는 날 수업은 같은 주 안에 보강하며, 반별 보강 시간은 수업 시간에 따로 알려 드립니다.

보강에 오기 어려운 학생은 담당 강사에게 미리 말해 주세요. 숙제와 수업 자료를 따로 챙겨 드립니다.
"""
