# 랜딩 페이지 (유형 4, ADR-0126). 메뉴 없는 한 장짜리. 글자는 예시다.
id = "landing"
name = "랜딩 페이지"
description = "한 장에 첫 인상·달라지는 점·쓰는 방법·후기·요금·질문·행동 유도"
theme_note = "선명한 주황에 크고 둥근 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fdfcfa", fg = "#1b1a17", primary = "#b8420f", muted = "#615d55", surface = "#ffffff", border = "#ebe7df" }, color_dark = { bg = "#151412", fg = "#f2efe9", primary = "#f49a6c", muted = "#aaa59b", surface = "#1e1c19", border = "#322f2a" }, radius = { sm = 10, md = 16, lg = 24 }, layout = { max_width = 1120 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { home_page = "home", show_search = false }

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { title = "흩어진 일정과 할 일을 한곳에서", text = "작은 팀이 일정과 할 일을 한 화면에서 나누는 가장 쉬운 방법입니다.", button = { label = "신청하기", link = "/#form-apply" } } },
  { kind = "features", region = "main", scope = "home", title = "달라지는 점", config = { style = "bento", tone = "soft", items = [
    { title = "모든 일이 한 화면에", text = "메신저, 메일, 메모에 흩어진 할 일을 모아 누가 무엇을 하는지 바로 보여 줍니다." },
    { title = "시간을 아낍니다", text = "매주 하던 일정 정리와 공유를 알아서 해 줍니다." },
    { title = "실수가 줄어듭니다", text = "마감이 다가오면 미리 알려 드려 놓치는 일이 없습니다." },
  ] } },
  { kind = "features", region = "main", scope = "home", title = "쓰는 방법", config = { style = "steps", items = [
    { title = "가입", text = "1분이면 됩니다." },
    { title = "설정", text = "안내를 따라 세 칸만 채웁니다." },
    { title = "시작", text = "오늘부터 씁니다." },
  ] } },
  { kind = "testimonials", region = "main", scope = "home", title = "먼저 써 본 분들", config = { tone = "soft", items = [
    { quote = "실제 고객의 말을 여기에 옮겨 적습니다. 지어낸 후기는 쓰지 않습니다.", name = "고객 이름", role = "하는 일" },
    { quote = "무엇이 어떻게 나아졌는지 구체적인 말일수록 좋습니다.", name = "고객 이름", role = "하는 일" },
  ] } },
  { kind = "plans", region = "main", scope = "home", title = "요금", config = { plans = [
    { name = "기본", price = "무료", features = ["핵심 기능", "이메일 답변"], button = { label = "시작하기", link = "/#form-apply" } },
    { name = "프로", price = "19,000원", period = "월", featured = true, note = "가장 많이 고릅니다", features = ["기본의 모든 것", "무제한 사용", "빠른 답변"], button = { label = "프로 시작", link = "/#form-apply" } },
    { name = "팀", price = "문의", features = ["프로의 모든 것", "구성원 관리", "전담 담당자"], button = { label = "문의하기", link = "/#form-apply" } },
  ] } },
  { kind = "faq", region = "main", scope = "home", title = "자주 묻는 질문", config = { items = [
    { q = "언제든 그만둘 수 있나요?", a = "네. 다음 결제일 전에 해지하면 더 나가지 않습니다." },
    { q = "환불되나요?", a = "결제 후 7일 안에 쓰지 않았다면 전액 돌려 드립니다." },
  ] } },
  { kind = "contact_form", region = "main", scope = "home", title = "먼저 신청해 두세요", config = { form = "apply", tone = "soft", purpose = "서비스 안내", submit = "신청하기", done = "신청을 받았습니다. 곧 안내드리겠습니다.", fields = [
    { key = "name", label = "이름", required = true },
    { key = "email", label = "메일", type = "email", required = true },
  ] } },
]
