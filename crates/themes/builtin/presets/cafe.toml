# 소상공인 가게 (SPEC §8.6, ADR-0126). 글자는 예시다. 에이전트가 가게 정보로 바꾼다.
id = "cafe"
name = "가게"
description = "첫 인상·메뉴판·영업시간·오시는 길 첫 화면, 소식·사진 게시판"
theme_note = "따뜻한 크림 바탕에 벽돌색, 알약처럼 둥근 단추"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fbf8f2", fg = "#241f1a", primary = "#9a3f18", muted = "#685f54", surface = "#ffffff", border = "#e8dfd1" }, color_dark = { bg = "#191512", fg = "#f0e9df", primary = "#eea57d", muted = "#b6ab9c", surface = "#231e1a", border = "#372f28" }, radius = { sm = 40, md = 18, lg = 28 }, layout = { max_width = 1080 } }

[[ops]]
op = "board.ensure"
slug = "notice"
name = "소식"
kind = "notice"
sort_order = 0

[[ops]]
op = "board.ensure"
slug = "photo"
name = "사진"
kind = "gallery"
layout = "gallery"
sort_order = 1

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "소식", link = { kind = "board", slug = "notice" } },
  { label = "사진", link = { kind = "board", slug = "photo" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "동네에서 오래 머물 수 있는 곳", button = { label = "소식 보기", link = "/b/notice" }, button2 = { label = "사진 보기", link = "/b/photo" } } },
  { kind = "features", region = "main", scope = "home", title = "이런 점을 챙깁니다", config = { style = "rows", tone = "soft", items = [
    { title = "그날 내린 커피", text = "원두는 일주일 안에 볶은 것만 씁니다." },
    { title = "직접 굽는 빵", text = "오전에 구워 그날 다 팝니다." },
    { title = "오래 앉아도 좋은 자리", text = "콘센트와 넓은 탁자를 넉넉히 두었습니다." },
  ] } },
  { kind = "price_list", region = "main", scope = "home", title = "메뉴", config = { note = "가격은 예시입니다.", groups = [
    { name = "커피", items = [
      { name = "아메리카노", price = "4,500원" },
      { name = "카페라테", price = "5,000원" },
      { name = "핸드드립", price = "6,000원", note = "오늘의 원두로 내립니다" },
    ] },
    { name = "빵과 디저트", items = [
      { name = "소금빵", price = "3,500원" },
      { name = "바스크 치즈케이크", price = "6,500원" },
      { name = "오늘의 쿠키", price = "3,000원" },
    ] },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "소식", config = { board = "notice", limit = 4 } },
  { kind = "hours", region = "main", scope = "home", title = "영업시간", config = { tone = "soft", note = "재료가 떨어지면 일찍 닫을 수 있습니다.", rows = [
    { days = "평일", time = "09:00 ~ 21:00" },
    { days = "주말", time = "10:00 ~ 20:00" },
    { days = "매주 월요일", time = "쉽니다" },
  ] } },
  { kind = "visit", region = "main", scope = "home", title = "오시는 길", config = { name = "가게 이름", address = "서울특별시 중구 세종대로 110", phone = "02-000-0000", transit = "지하철역에서 걸어서 5분입니다.", parking = "건물 뒤편 공영 주차장을 이용해 주세요." } },
]
