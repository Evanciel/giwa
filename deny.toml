# cargo-deny 설정. 허용 라이선스는 docs/PHASE1_PLAN.md §10 기준.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # 번들 SQLite 3.53 의 WAL 페이지 크기 불일치 메모리 노출 (ADR-0174). 남이 만든 DB 와 -wal 을
    # 함께 열 때만 걸리는데, 기와는 데이터 디렉터리의 자기 DB 와 자기가 만든 백업 사본만 연다.
    # 복원은 -wal 을 풀지 않는다. sqlx 0.9.0 이 libsqlite3-sys <0.38 로 묶어 0.39 로 못 올린다.
    # sqlx 가 0.39 를 받는 판을 내면 올리고 이 줄을 지운다.
    { id = "RUSTSEC-2026-0459", reason = "local-only; Giwa opens only its own database files. Blocked on sqlx release allowing libsqlite3-sys 0.39 (ADR-0174)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # ammonia 의 필수 의존 cssparser
    "MPL-2.0",
    # lettre·sqlx 가 쓰는 작은 의존 (ADR-0174). 둘 다 출처 표기도 요구하지 않는 허용형이다.
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
