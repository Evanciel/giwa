# 교회 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 말씀 요약·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "sermons"

[[ops.items]]
title = "쉼이 필요한 사람에게"
image = "landscape"
alt = "푸른 들판 예시 그림"
meta = { service = "sunday", preacher = "담임목사", verse = "시편 23편 1~6절", video = "https://example.com/sermons/rest" }
body_md = """
바쁘게 달려온 한 주 끝에 우리는 쉼을 찾습니다. 오늘 본문은 목자가 양을 푸른 풀밭과 쉴 만한 물가로 이끄는 장면을 보여 줍니다.

## 함께 생각할 것

- 나는 무엇에 쫓기며 한 주를 보냈는지
- 이번 주에 잠시 멈추어 쉴 시간은 언제인지

이 글은 예시입니다. 설교 요약과 영상 주소를 넣어 고쳐 써 주세요.
"""

[[ops.items]]
title = "작은 일에 충성하는 삶"
image = "still"
alt = "등불 예시 그림"
meta = { service = "wednesday", preacher = "부목사", verse = "누가복음 16장 10절" }
body_md = """
큰일보다 매일 되풀이되는 작은 일에서 우리의 마음이 드러납니다. 수요 예배에서는 일상의 작은 약속을 지키는 일에 대해 나누었습니다.

이번 주에는 미뤄 둔 작은 약속 하나를 지켜 보기로 함께 마음을 모았습니다.
"""

[[ops.items]]
title = "감사로 여는 아침"
image = "landscape"
alt = "해 뜨는 풍경 예시 그림"
meta = { service = "dawn", preacher = "담임목사", verse = "데살로니가전서 5장 16~18절" }
body_md = """
새벽 기도회에서 감사로 하루를 여는 것에 대해 나누었습니다. 오늘 하루 감사할 것 세 가지를 적어 보는 것으로 기도를 시작했습니다.

새벽 기도는 월요일부터 금요일까지 05:30에 모입니다.
"""

[[ops.items]]
title = "함께 걷는 공동체"
image = "people"
alt = "함께 걷는 사람들 예시 그림"
meta = { service = "special", preacher = "초청 강사", verse = "전도서 4장 9~12절" }
body_md = """
가을 특별 집회 첫날 말씀입니다. 혼자보다 둘이 낫고, 세 겹 줄은 쉽게 끊어지지 않는다는 본문으로 공동체의 의미를 나누었습니다.

집회 기간에 나눈 말씀은 차례로 이 게시판에 올립니다.
"""

[[ops]]
op = "posts.ensure"
board = "news"

[[ops.items]]
title = "추수감사 주일 예배"
image = "people"
alt = "추수감사 예배 예시 그림"
body_md = """
추수감사 주일에 온 교회가 함께 예배드렸습니다. 아이들이 준비한 찬양과 감사 편지 낭독이 있었습니다.

예배 뒤에는 함께 점심을 나누었습니다. 음식을 준비해 주신 여러분께 고맙습니다.
"""

[[ops.items]]
title = "청년부 가을 나들이"
image = "landscape"
alt = "가을 나들이 예시 그림"
body_md = """
청년부가 가까운 산으로 가을 나들이를 다녀왔습니다. 천천히 걸으며 서로의 근황을 나누는 시간이었습니다.

다음 청년부 모임 일정은 [교육·훈련](/b/programs) 게시판에서 안내합니다.
"""

[[ops.items]]
title = "어린이부 성탄 발표회 연습"
image = "people"
alt = "어린이 발표회 연습 예시 그림"
body_md = """
어린이부가 성탄 발표회를 앞두고 주일 오후마다 연습하고 있습니다. 노래와 짧은 연극을 준비하고 있습니다.

발표회 날짜와 시간은 주보로 알려 드립니다.
"""

[[ops.items]]
title = "이웃과 나눈 김장"
image = "food"
alt = "김장 나눔 예시 그림"
body_md = """
올해도 성도들이 함께 김장을 담가 동네 이웃과 나누었습니다. 이른 아침부터 많은 분이 손을 보태 주셨습니다.

나눔에 함께해 주신 모든 분께 고맙습니다.
"""

[[ops.items]]
title = "예배당 의자를 새로 들였습니다"
image = "room"
alt = "예배당 예시 그림"
body_md = """
오래된 예배당 의자를 바꾸었습니다. 등받이가 조금 높아져 오래 앉아 계셔도 편합니다.

휠체어가 들어갈 자리를 앞쪽과 뒤쪽에 따로 마련했습니다. 안내 위원에게 말씀해 주세요.
"""

[[ops.items]]
title = "새가족 환영 모임"
image = "people"
alt = "환영 모임 예시 그림"
body_md = """
이번 달에 등록한 새가족을 환영하는 모임을 가졌습니다. 차를 나누며 서로 소개하는 시간이었습니다.

처음 오셨다면 [새가족 안내](/p/welcome)에 연락처를 남겨 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "programs"

[[ops.items]]
title = "새가족 공부 모임 (4주)"
meta = { target = "새가족", deadline = "2026-11-29", schedule = "12월 6일부터 매주 주일 13:00, 4주", place = "교육관 1층" }
body_md = """
교회에 처음 오신 분들이 교회를 알아 가는 4주 모임입니다. 교회가 걸어온 길, 예배와 모임, 함께 섬기는 일을 차례로 나눕니다.

신청은 안내 위원에게 하시거나 [새가족 안내](/p/welcome)에 남겨 주세요.
"""

[[ops.items]]
title = "겨울 성경 통독반"
image = "desk"
alt = "성경 통독 예시 그림"
meta = { target = "누구나", deadline = "2026-12-20", schedule = "1월 3일부터 매주 토요일 10:00, 8주", place = "소예배실" }
body_md = """
겨울 동안 함께 성경을 소리 내어 읽는 모임입니다. 매주 정해진 분량을 읽고 짧게 느낀 점을 나눕니다.

처음 읽어 보는 분도 편하게 오세요. 읽기 계획표는 첫 모임에 나누어 드립니다.
"""

[[ops.items]]
title = "청년부 수련회"
image = "landscape"
alt = "수련회 예시 그림"
meta = { target = "청년", deadline = "2027-01-10", schedule = "1월 22일 ~ 24일, 2박 3일", place = "수련원 (신청자에게 안내)" }
body_md = """
청년부 겨울 수련회를 엽니다. 말씀과 나눔, 함께 걷는 시간을 준비했습니다.

- 회비: 신청할 때 안내합니다
- 차량: 교회에서 함께 출발합니다

자리가 한정되어 있으니 일찍 신청해 주세요.
"""

[[ops.items]]
title = "가을 제자 훈련 (마감)"
meta = { target = "등록 교인", deadline = "2026-09-30", schedule = "10월 5일부터 매주 월요일 19:30, 10주", place = "교육관 2층" }
body_md = """
가을 제자 훈련은 신청을 마감하고 진행 중입니다. 다음 훈련은 봄에 다시 안내합니다.

함께하고 싶은 분은 교회 사무실에 미리 이름을 남겨 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "bulletin"

[[ops.items]]
title = "주보 (11월 둘째 주)"
notice = true
body_md = """
이번 주 주보입니다. 예배 순서, 교회 소식, 기도 제목을 담았습니다.

주보 파일은 글을 고칠 때 첨부해 올려 주세요. 이 글은 예시입니다.
"""

[[ops.items]]
title = "주보 (11월 첫째 주)"
body_md = """
지난주 주보입니다. 추수감사 주일 안내와 김장 나눔 일정이 들어 있습니다.
"""

[[ops.items]]
title = "새가족 안내 책자"
image = "desk"
alt = "안내 책자 예시 그림"
body_md = """
처음 오신 분께 드리는 안내 책자입니다. 예배 시간, 부서 소개, 오시는 길을 담았습니다.

종이 책자는 예배당 입구 안내석에 있습니다.
"""

[[ops.items]]
title = "올해 교회 행사 일정표"
body_md = """
올해 교회 행사 일정을 한 장에 모았습니다. 절기와 행사에 따라 바뀌면 [교회 소식](/b/news)으로 알려 드립니다.
"""
