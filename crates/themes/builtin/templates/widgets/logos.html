{# 함께하는 곳 (ADR-0156). 그림이 없으면 이름을 글자로 보인다. #}
<ul class="logo-row{% if w.data.mono %} is-mono{% endif %}">
  {% for i in w.data.items %}<li>
    {% if i.link %}<a href="{{ i.link.href }}"{% if i.link.external %} rel="noopener noreferrer"{% endif %}>{% endif %}{% if i.image %}<img src="{{ i.image.src }}" width="{{ i.image.width }}" height="{{ i.image.height }}" alt="{{ i.name }}" loading="lazy"{{ edit_image("items." ~ loop.index0 ~ ".image") }}>{% else %}<span class="logo-name"{{ edit_field("items." ~ loop.index0 ~ ".name") }}>{{ i.name }}</span>{% endif %}{% if i.link %}</a>{% endif %}
    {% if w.edit_id and not i.image %}<span class="maru-img-empty maru-img-inline"{{ edit_image("items." ~ loop.index0 ~ ".image") }}>{{ "로고 넣기"|t }}</span>{% endif %}
  </li>{% endfor %}
</ul>
