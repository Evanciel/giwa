# 학원·교습소 (ADR-0139). 강좌·시간표·수강료·강사 소개와 상담 신청이 중심이다.
# 온라인 강의 노트는 `course` 몫이다. 글자는 예시다.
id = "academy"
name = "학원"
description = "강좌·시간표·수강료·강사 소개, 공지·학부모 안내, 수업 소식, 상담 신청"
theme_note = "깨끗한 흰 바탕에 숲 초록, 또렷한 카드"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fbfdfb", fg = "#16211a", primary = "#2b7a34", muted = "#56625a", surface = "#ffffff", border = "#dfe8e0" }, color_dark = { bg = "#111712", fg = "#e8f0e9", primary = "#8fd59a", muted = "#a1ada3", surface = "#18201a", border = "#2a352c" }, radius = { sm = 6, md = 12, lg = 18 }, layout = { max_width = 1120 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지·학부모 안내"
kind = "notice"
sort_order = 0

[[ops]]
op = "board.ensure"
slug = "news"
name = "수업 소식"
kind = "gallery"
layout = "card"
sort_order = 1
policy = { write = "editor", comment = "member" }

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "classes"
title = "강좌 안내"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "teachers"
title = "강사 소개"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "consult"
title = "상담 신청"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "학년별 소규모 반으로 수업하는 학원입니다. 수업 안내와 상담 예약을 이곳에서 받습니다.", home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "강좌 안내", link = { kind = "page", slug = "classes" } },
  { label = "강사 소개", link = { kind = "page", slug = "teachers" } },
  { label = "공지·학부모 안내", link = { kind = "board", slug = "notice" } },
  { label = "수업 소식", link = { kind = "board", slug = "news" } },
  { label = "상담 신청", link = { kind = "page", slug = "consult" } },
]

