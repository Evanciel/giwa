# 개인 블로그 프리셋. 모든 op 는 ensure 라서 `maru init` 을 다시 실행해도 안전하다.
id = "blog"
name = "개인 블로그"
description = "블로그 게시판, 소개 페이지(초안), 헤더 메뉴"

[[ops]]
op = "board.ensure"
slug = "blog"
name = "블로그"
kind = "blog"

[[ops]]
op = "page.ensure"
slug = "about"
title = "소개"
body_md = """
안녕하세요. 이 블로그에는 일상에서 배우고 느낀 것을 천천히 기록합니다.

좋아하는 책과 음식, 다녀온 곳, 요즘 공부하는 것들을 주로 씁니다. 글을 읽고 떠오른 생각이 있으면 언제든 댓글로 나눠 주세요.
"""
publish = false

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "글", link = { kind = "board", slug = "blog" } },
]

[[ops]]
op = "settings.ensure"
values = { description = "일상과 공부한 것을 기록하는 개인 블로그입니다." }
