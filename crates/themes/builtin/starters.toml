# 글로 된 틀 (ADR-0167). 돈을 받는 사이트에 필요한 약관의 뼈대다. 법률 자문이 아니므로 운영자가 자기 거래에 맞게 고친다.
[[starters]]
id = "terms"
label = "이용약관"
description = "회원·주문·결제·청약철회를 다루는 약관 뼈대. 내 거래에 맞게 고쳐 쓰세요."
body_md = """
> 이 글은 고쳐 쓰라고 둔 뼈대입니다. [ ] 안을 채우고, 내 거래와 맞지 않는 조항은 지우거나 고친 뒤 공개하세요. 법률 자문이 아닙니다.

## 제1조 (목적)

이 약관은 [상호](이하 「회사」)가 이 사이트에서 제공하는 상품·서비스(이하 「서비스」)를 이용하는 데 필요한 회사와 이용자의 권리·의무를 정합니다.

## 제2조 (약관의 게시와 변경)

1. 회사는 이 약관을 사이트 첫 화면에서 찾을 수 있는 곳에 게시합니다.
2. 약관을 바꿀 때는 바뀌는 날 7일 전부터(이용자에게 불리하면 30일 전부터) 바뀌는 내용과 날짜를 알립니다.

## 제3조 (주문과 계약)

1. 이용자는 사이트에서 상품·서비스와 금액을 확인하고 결제해 주문합니다.
2. 회사는 결제가 확인되면 주문 확인을 전자우편이나 화면으로 알립니다. 이때 계약이 이루어집니다.
3. 재고가 없거나 주문 내용에 명백한 잘못이 있으면 회사는 주문을 받지 않고 결제 금액을 돌려줄 수 있습니다.

## 제4조 (결제)

결제는 사이트에 안내한 방법(카드·간편결제·무통장 입금 등)으로 합니다. 카드 정보는 결제대행사가 처리하며 회사는 저장하지 않습니다.

## 제5조 (공급)

회사는 [결제 후 며칠 안에 / 예약한 날짜에] 상품·서비스를 공급합니다. 늦어지면 그 까닭과 예정일을 알립니다.

## 제6조 (청약철회와 환불)

청약철회·환불 기준과 방법은 [환불 규정](/refund) 페이지를 따릅니다.

## 제7조 (개인정보)

회사는 주문 처리에 필요한 최소한의 정보(이름·연락처 등)만 받고, 관계 법령이 정한 기간이 지나면 지웁니다.

## 제8조 (분쟁 해결)

이용자의 불만은 [전화·전자우편]으로 받고, 처리 결과를 영업일 [3]일 안에 알립니다. 해결되지 않으면 한국소비자원·전자거래분쟁조정위원회 등에 조정을 신청할 수 있습니다.

부칙: 이 약관은 [2026년 0월 0일]부터 시행합니다.
"""

[[starters]]
id = "refund"
label = "환불 규정"
description = "청약철회 기간, 환불이 안 되는 경우, 돌려주는 방법과 기간. 내 거래에 맞게 고쳐 쓰세요."
body_md = """
> 이 글은 고쳐 쓰라고 둔 뼈대입니다. [ ] 안을 채우고 내 거래에 맞게 고친 뒤 공개하세요. 법률 자문이 아닙니다.

## 청약철회 기간

- 상품을 받은 날(서비스는 계약한 날)부터 **7일 안에** 주문을 취소하고 환불을 요청할 수 있습니다.
- 받은 상품이 광고·계약 내용과 다르면 받은 날부터 3개월, 그 사실을 안 날부터 30일 안에 요청할 수 있습니다.

## 환불이 어려운 경우

- 이용자의 책임으로 상품이 없어지거나 훼손된 경우
- 사용하거나 일부 소비해 가치가 크게 줄어든 경우
- 복제할 수 있는 상품의 포장을 뜯은 경우
- 날짜가 정해진 서비스(예약·수업 등)의 [며칠 전] 이후 취소: [위약금 기준을 적어 주세요]

환불이 어려운 상품·서비스는 주문 화면에 미리 알립니다.

## 환불 방법과 기간

- 환불 요청은 [전화·전자우편]으로 받습니다. 주문 번호를 함께 알려 주세요.
- 카드·간편결제는 결제를 취소해 돌려드립니다. 카드사 사정에 따라 3~7영업일이 걸릴 수 있습니다.
- 무통장 입금은 알려 주신 계좌로 돌려드립니다.
- 회사는 상품을 돌려받은 날(서비스는 취소를 받은 날)부터 3영업일 안에 환불합니다.

## 반품 비용

단순 변심에 따른 반품 배송비는 이용자가, 상품 하자·오배송은 회사가 부담합니다.
"""

[[starters]]
id = "privacy"
label = "개인정보처리방침"
description = "받는 정보·목적·보관 기간·맡기는 곳·권리·책임자. 문의 폼·회원 가입·결제를 받는 사이트에 필요합니다."
body_md = """
> 이 글은 고쳐 쓰라고 둔 뼈대입니다. [ ] 안을 채우고, 실제로 받지 않는 정보나 쓰지 않는 곳은 지운 뒤 공개하세요. 법률 자문이 아닙니다.

[상호](이하 「회사」)는 개인정보 보호법에 따라 이용자의 개인정보를 다음과 같이 처리합니다.

## 1. 받는 정보와 쓰는 곳

| 쓰는 곳 | 받는 정보 | 보관 기간 |
|---|---|---|
| 문의·상담 신청 | 이름, 연락처, 문의 내용 | 답변을 마친 뒤 [1년] |
| 회원 가입 | 전자우편, 닉네임, 비밀번호(암호화) | 탈퇴할 때까지 |
| 주문·결제 | 이름, 전자우편, 전화번호, 주문 내용 | 전자상거래법에 따라 5년 |

받은 정보는 위 목적에만 쓰고, 목적이 바뀌면 다시 동의를 받습니다.

## 2. 다른 곳에 주는 경우

법령에 근거가 있거나 이용자가 동의한 경우를 빼고는 개인정보를 다른 곳에 주지 않습니다.

## 3. 처리를 맡기는 곳

| 맡기는 곳 | 맡기는 일 |
|---|---|
| [결제대행사 이름] | 카드·간편결제 처리 |
| [호스팅·서버 제공자] | 사이트와 데이터 보관 |
| [전자우편 발송 서비스] | 주문 확인·안내 편지 발송 |

## 4. 지우는 방법

보관 기간이 끝나거나 목적을 이루면 바로 지웁니다. 전자 파일은 되살릴 수 없게 지우고, 종이는 파쇄합니다.

## 5. 이용자의 권리

이용자는 언제든 자기 개인정보를 열람·정정·삭제하거나 처리를 멈추라고 요청할 수 있습니다. 아래 책임자에게 전자우편이나 전화로 요청하면 영업일 [10]일 안에 처리합니다.

## 6. 안전하게 지키는 조치

- 비밀번호는 되돌릴 수 없는 방식으로 암호화해 보관합니다.
- 관리 화면은 정해진 운영자만 쓸 수 있습니다.
- 데이터는 정기적으로 백업하고 접속 기록을 남깁니다.

## 7. 쿠키

로그인 상태를 유지하려고 쿠키를 씁니다. 광고·추적 쿠키는 [쓰지 않습니다 / 쓰는 경우 이름과 목적을 적어 주세요]. 브라우저 설정에서 쿠키를 거부할 수 있지만, 그러면 로그인이 되지 않을 수 있습니다.

## 8. 개인정보 보호책임자

- 이름: [이름]
- 연락처: [전화], [전자우편]

개인정보 침해 신고나 상담은 개인정보침해신고센터(국번 없이 118)에도 할 수 있습니다.

## 9. 바뀔 때

이 방침을 바꾸면 시행 7일 전에 사이트에 알립니다.

시행일: [2026년 0월 0일]
"""
