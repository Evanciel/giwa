{# 댓글 반응 단추 (ADR-0068). `c` 는 _comments.html 의 댓글이다. #}
<form class="react-bar small" method="post" action="/m/reaction/comment/{{ c.id }}" aria-label="이 댓글에 반응하기">
  {% for k in s.data.by_id[c.id] %}
  <button type="submit" name="kind" value="{{ k.id }}" class="pill{% if k.pressed %} on{% endif %}" aria-pressed="{% if k.pressed %}true{% else %}false{% endif %}">{{ k.label }} <span class="pill-count">{{ k.count }}</span></button>
  {% endfor %}
</form>
