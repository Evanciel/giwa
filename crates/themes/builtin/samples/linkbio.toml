# 링크 모음 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 작업·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "news"

[[ops.items]]
title = "새 작업을 올렸습니다"
image = "abstract"
alt = "새 작업을 나타낸 추상 예시 그림"
body_md = """
한 달 동안 붙잡고 있던 작업을 드디어 마무리했습니다. 처음 생각과는 꽤 다른 모습이 되었지만, 그 과정이 더 즐거웠습니다.

만들면서 메모해 둔 이야기는 다음 소식에서 조금 더 풀어 보겠습니다.
"""

[[ops.items]]
title = "작업 의뢰를 다시 받습니다"
body_md = """
잠시 쉬었던 작업 의뢰를 12월부터 다시 받습니다. 한 달에 두 건만 받아 한 건 한 건에 충분히 시간을 쓰려고 합니다.

- 받는 일: 소개 그림, 작은 책 표지, 행사 포스터
- 기간: 보통 2주에서 3주

함께하고 싶은 일이 있으면 첫 화면 아래 연락하기에 남겨 주세요. 메일 주소를 드러내지 않고 받습니다.
"""

[[ops.items]]
title = "작업실 정리하는 날"
image = "room"
alt = "햇빛이 드는 작업실 예시 그림"
body_md = """
계절이 바뀌어 작업실을 정리했습니다. 책상 위치를 창가로 옮겼더니 오후 빛이 길게 들어옵니다.

쓰지 않는 재료는 상자에 모아 두었습니다. 나눔 소식은 따로 올리겠습니다.
"""

[[ops.items]]
title = "연말에 작은 전시를 엽니다"
image = "people"
alt = "전시를 보는 사람들 예시 그림"
body_md = """
올해 작업을 모아 작은 전시를 엽니다. 크지 않은 공간이라 천천히 둘러보시기 좋습니다.

- 기간: 12월 20일부터 12월 27일까지
- 시간: 낮 12시부터 저녁 7시까지

자세한 장소는 전시 일주일 전에 이 소식 게시판에 올리겠습니다.
"""
