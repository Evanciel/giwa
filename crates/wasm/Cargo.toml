[package]
name = "giwa-wasm"
description = "Giwa 외부 모듈(WASM) 런타임"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 워크스페이스 린트는 unsafe 를 forbid 로 막아 아래 한 곳도 풀 수 없다. 여기만 deny 로 두고
# 우리가 쓴 .cwasm 캐시를 읽는 한 곳(`runtime::load_cached`)에서만 허용한다 (ADR-0177).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[dependencies]
giwa-core.workspace = true
giwa-modules.workspace = true
giwa-storage.workspace = true
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
tempfile.workspace = true
