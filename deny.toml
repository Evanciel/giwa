# cargo-deny 설정. 허용 라이선스는 docs/PHASE1_PLAN.md §10 기준.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0459 예외는 vendor/sqlx-sqlite 로 libsqlite3-sys 0.39 를 받아 지웠다 (ADR-0175).
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # ammonia 의 필수 의존 cssparser
    "MPL-2.0",
    # lettre·sqlx 가 쓰는 작은 의존 (ADR-0174). 둘 다 출처 표기도 요구하지 않는 허용형이다.
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
