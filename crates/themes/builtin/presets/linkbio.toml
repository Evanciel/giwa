# 링크 모음 (ADR-0139). 한 장짜리 첫 화면에 소개와 큰 링크 줄을 둔다. 게시판은 소식 하나다.
# 링크는 예시로 사이트 안 주소를 둔다. 에이전트가 바깥 주소(https://…)로 바꾼다. 글자는 예시다.
id = "linkbio"
name = "링크 모음"
description = "한 장짜리 프로필, 큰 링크 줄, 최근 소식"
theme_note = "좁은 폭 한가운데, 보라 강조와 알약 모양 단추"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#faf9fd", fg = "#1b1726", primary = "#6d32d8", muted = "#5c5670", surface = "#ffffff", border = "#e5e1ef" }, color_dark = { bg = "#131019", fg = "#eeebf6", primary = "#c4a8f8", muted = "#a7a0ba", surface = "#1b1724", border = "#2f2a3c" }, radius = { sm = 40, md = 18, lg = 28 }, layout = { max_width = 640 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "news"
name = "소식"
kind = "blog"
layout = "list"
sort_order = 0
policy = { write = "editor", comment = "member" }

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "운영하는 채널과 새 소식을 한곳에 모았습니다.", home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "소식", link = { kind = "board", slug = "news" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "일상과 여행을 그림으로 남기는 일러스트레이터", text = "작은 순간을 따뜻한 색으로 그립니다. 새 그림과 소식은 아래 링크에서 가장 먼저 만나 보세요." } },
  { kind = "features", region = "main", scope = "home", config = { style = "rows", items = [
    { title = "이번 달 새 그림", text = "가장 최근에 그린 그림을 한곳에 모았습니다", link = "/b/news" },
    { title = "그림 의뢰 안내", text = "의뢰 방법과 진행 순서를 알려 드립니다", link = "/b/news" },
    { title = "엽서와 스티커", text = "그림으로 만든 작은 소품을 판매합니다", link = "/b/news" },
    { title = "새 소식", text = "최근에 올린 글", link = "/b/news" },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "최근 소식", config = { board = "news", limit = 3 } },
  { kind = "contact_form", region = "main", scope = "home", title = "연락하기", config = { form = "contact", purpose = "협업·문의 답장", intro = "메일 주소를 드러내지 않고 받습니다. 남겨 주시면 답장드립니다.", submit = "보내기", fields = [
    { key = "name", label = "이름", required = true },
    { key = "email", label = "답장받을 메일", type = "email", required = true },
    { key = "topic", label = "문의 종류", type = "select", options = ["협업 제안", "질문", "그 밖의 문의"] },
    { key = "message", label = "내용", type = "textarea", required = true },
  ] } },
]
