# 매거진 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 기사 내용은 예시다.

[[ops]]
op = "posts.ensure"
board = "feature"

[[ops.items]]
title = "느리게 사는 동네를 걷다"
image = "landscape"
alt = "낮은 지붕이 이어진 동네 풍경 예시 그림"
body_md = """
큰길에서 한 골목만 들어가도 시간이 다르게 흐르는 동네가 있습니다. 이번 기획은 그런 동네를 하루 동안 천천히 걸으며 만난 장면을 모았습니다.

## 아침의 골목

문을 여는 작은 가게들, 화분에 물을 주는 이웃, 학교 가는 아이들. 특별할 것 없는 장면이 모여 동네의 얼굴이 됩니다.

## 오후의 쉼표

해가 기울면 골목 의자에 사람들이 하나둘 앉습니다. 이 동네가 느린 까닭은 어쩌면 앉을 자리가 많아서인지도 모릅니다.
"""

[[ops.items]]
title = "작은 방을 넓게 쓰는 다섯 가지 방법"
image = "room"
alt = "정돈된 작은 방 예시 그림"
body_md = """
혼자 사는 집이 좁게 느껴질 때, 가구를 바꾸기 전에 해 볼 수 있는 일을 정리했습니다.

1. 바닥을 최대한 비웁니다.
2. 높이가 낮은 가구로 시선을 엽니다.
3. 색은 두세 가지로 줄입니다.
4. 거울을 창 맞은편에 둡니다.
5. 한 달에 한 번 쓰지 않는 물건을 덜어 냅니다.

편집부가 직접 해 보고 효과가 컸던 순서대로 적었습니다.
"""

[[ops.items]]
title = "겨울 식탁, 제철 재료로 차리기"
image = "food"
alt = "따뜻한 음식이 놓인 식탁 예시 그림"
body_md = """
추운 계절에 맛이 드는 재료로 소박한 한 상을 차려 보았습니다. 뿌리채소와 잎채소, 그리고 따뜻한 국 한 그릇이면 충분합니다.

## 장보기 요령

- 무와 배추는 묵직한 것을 고릅니다.
- 한 번에 많이 사기보다 이틀 치씩 나누어 삽니다.

재료가 단순할수록 불 조절과 간이 맛을 좌우합니다.
"""

[[ops.items]]
title = "도시의 밤을 기록하는 사람들"
image = "city"
alt = "불 켜진 도시의 밤 풍경 예시 그림"
body_md = """
모두가 잠든 시간에도 도시는 움직입니다. 이번 기획에서는 밤에 일하는 여러 직업의 하루를 따라가 보았습니다.

새벽 배송을 준비하는 사람, 밤새 문을 여는 가게를 지키는 사람, 첫차를 준비하는 사람. 그들의 이야기는 다음 호에서 이어집니다.
"""

[[ops]]
op = "posts.ensure"
board = "news"

[[ops.items]]
title = "편집부가 새 호 준비에 들어갔습니다"
image = "desk"
alt = "원고가 쌓인 책상 예시 그림"
body_md = """
다음 호 주제는 겨울과 쉼입니다. 편집부는 지금 기획 회의를 마치고 취재를 시작했습니다.

다루었으면 하는 이야기가 있으면 [매체 소개](/p/about)에 적힌 연락처로 보내 주세요.
"""

[[ops.items]]
title = "독자 의견을 받습니다"
body_md = """
어떤 글이 좋았는지, 어떤 이야기가 더 궁금한지 들려주세요. 보내 주신 의견은 편집 회의에서 함께 읽습니다.

의견을 주신 분께는 따로 답장을 드리고, 소개해도 좋다고 허락해 주신 의견은 다음 호에 싣습니다.
"""

[[ops.items]]
title = "연말 특별호를 냅니다"
image = "abstract"
alt = "특별호를 나타낸 추상 예시 그림"
body_md = """
한 해 동안 실었던 [기획](/b/feature) 가운데 독자 반응이 컸던 글을 모아 연말 특별호로 엮습니다. 미처 싣지 못한 뒷이야기도 함께 담았습니다.

특별호는 12월 셋째 주에 공개합니다.
"""

[[ops.items]]
title = "새 칼럼 연재를 시작합니다"
body_md = """
다음 주부터 [칼럼](/b/column) 게시판에 새 연재를 싣습니다. 매주 목요일, 생활 속 작은 질문 하나를 붙잡고 오래 생각해 보는 글입니다.
"""

[[ops.items]]
title = "사진 기고를 받습니다"
image = "landscape"
alt = "사진 기고를 나타낸 풍경 예시 그림"
body_md = """
계절을 담은 사진을 기고받습니다. 뽑힌 사진은 다음 호 기획 사이에 실립니다.

- 한 사람이 세 장까지 보낼 수 있습니다.
- 사진마다 찍은 계절과 짧은 설명을 붙여 주세요.
"""

[[ops.items]]
title = "누리집 글꼴을 바꿨습니다"
body_md = """
긴 글을 편하게 읽을 수 있도록 제목 글꼴과 줄 간격을 손보았습니다. 휴대전화에서 글이 작게 보이면 알려 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "column"

[[ops.items]]
title = "편집장의 글: 천천히 읽히는 글"
image = "desk"
alt = "책과 찻잔이 놓인 책상 예시 그림"
body_md = """
빨리 읽히는 글이 넘치는 때에 천천히 읽히는 글을 만들고 싶었습니다. 한 문단을 읽고 잠시 창밖을 보게 되는 글 말입니다.

이 매체가 그런 쉼표가 되었으면 합니다. 다음 호도 서두르지 않고 준비하겠습니다.
"""

[[ops.items]]
title = "물건을 오래 쓰는 마음"
body_md = """
고장 난 물건을 고쳐 쓰는 일은 생각보다 많은 것을 알려 줍니다. 어디가 약한지, 어떻게 만들어졌는지, 내가 그것을 얼마나 아꼈는지.

새것을 사는 즐거움도 있지만, 오래 쓴 물건에만 생기는 손때도 있습니다. 올겨울에는 서랍 속 고장 난 물건 하나를 꺼내 보려 합니다.
"""

[[ops.items]]
title = "아침 산책이 바꾼 것들"
image = "landscape"
alt = "아침 산책길 예시 그림"
body_md = """
한 달 동안 매일 아침 20분씩 걸었습니다. 대단한 변화는 없었지만, 하루를 시작하는 마음이 조금 달라졌습니다.

걷는 동안에는 휴대전화를 보지 않았습니다. 그 20분이 하루 가운데 가장 조용한 시간이 되었습니다.
"""

[[ops.items]]
title = "동네 책방에서 보낸 오후"
body_md = """
비 오는 오후, 동네 작은 책방에 오래 앉아 있었습니다. 주인이 고른 책들이 책장마다 짧은 손글씨 메모와 함께 놓여 있었습니다.

누군가 골라 준 책을 읽는 일은 그 사람과 조용히 이야기를 나누는 일과 닮았습니다.
"""

[[ops.items]]
title = "혼자 먹는 저녁에 대하여"
image = "food"
alt = "한 사람 몫의 저녁상 예시 그림"
body_md = """
혼자 먹는 저녁을 대충 때우지 않기로 했습니다. 반찬 하나라도 그릇에 옮겨 담고, 식탁에 앉아 천천히 먹습니다.

그것만으로도 하루를 스스로 돌보았다는 기분이 듭니다.
"""
