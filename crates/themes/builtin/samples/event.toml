body_md = """
지난 가을 정기 모임은 마감되었습니다. 함께해 주신 분들께 감사드립니다.

다음 모임 일정은 이 게시판에 먼저 올립니다. 마감된 행사는 이렇게 지난 행사로 표시됩니다.
