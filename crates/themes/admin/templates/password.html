{% extends "_base.html" %}
{% block title %}비밀번호{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>{% if has_password %}비밀번호 바꾸기{% else %}비밀번호 정하기{% endif %}</h1>
<p class="hint">{{ min }}자 이상. 바꾸면 다른 기기의 로그인은 모두 끊깁니다.</p>
<form method="post" action="/admin/password" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <input type="text" name="username" autocomplete="username" value="{{ me.email }}" hidden>
  <label for="password">새 비밀번호</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="{{ min }}" required>
  <label for="confirm">한 번 더</label>
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="{{ min }}" required>
  <button type="submit">저장</button>
</form>
{% endblock %}
