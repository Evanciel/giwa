# 강의 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 강의 주제·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "notes"

[[ops.items]]
title = "1주차 노트: 쓰기 전에 정할 세 가지"
image = "desk"
alt = "노트와 연필이 놓인 책상 예시 그림"
body_md = """
첫 시간에는 글을 쓰기 전에 정해 둘 것을 함께 살펴보았습니다.

- 누가 읽는 글인가
- 읽고 나서 무엇을 기억했으면 하는가
- 몇 문단 안에 끝낼 것인가

이 세 가지를 한 줄씩 적어 두면 쓰다가 길을 잃어도 다시 돌아올 곳이 생깁니다. 다음 시간까지 각자 쓰고 싶은 주제 하나를 골라 세 줄로 적어 오세요.
"""

[[ops.items]]
title = "1주차 과제: 첫 문장 다섯 개 써 오기"
body_md = """
같은 주제로 첫 문장을 다섯 가지 다르게 써 오는 과제입니다. 질문으로 시작하기, 장면으로 시작하기, 결론부터 말하기처럼 방법을 바꿔 보세요.

다섯 문장 가운데 가장 마음에 드는 것 하나에 표시해 오시면, 다음 시간에 왜 그 문장을 골랐는지 이야기 나눕니다. 길게 쓰지 않아도 괜찮습니다.
"""

[[ops.items]]
title = "2주차 노트: 문단은 한 가지 말만 합니다"
image = "desk"
alt = "원고를 고치는 책상 예시 그림"
body_md = """
이번 주에는 직접 초고를 써 보았습니다. 고칠 때 가장 먼저 볼 곳은 문단입니다.

## 문단을 점검하는 법

1. 문단마다 하고 싶은 말을 한 줄로 요약해 봅니다.
2. 요약이 두 줄이 되면 문단을 나눕니다.
3. 요약끼리 이어 읽어 흐름이 자연스러운지 봅니다.

이 방법만 지켜도 읽는 사람이 훨씬 덜 지칩니다.
"""

[[ops.items]]
title = "3주차 노트: 서로 고쳐 줄 때의 약속"
image = "people"
alt = "둘러앉아 이야기하는 사람들 예시 그림"
body_md = """
3주차에는 서로의 글을 읽고 의견을 나눕니다. 편하게 말하되 아래 약속을 지켜 주세요.

- 좋았던 점을 먼저 하나 말합니다.
- 고칠 점은 문장을 짚어서 구체적으로 말합니다.
- 고칠지 말지는 글쓴이가 정합니다.

받은 의견은 노트에 적어 두고, 다음 주에 고친 글과 함께 비교해 보세요.
"""

[[ops.items]]
title = "4주차 노트: 마지막으로 소리 내어 읽기"
body_md = """
완성한 글은 꼭 한 번 소리 내어 읽어 보세요. 숨이 막히는 곳은 문장이 너무 긴 곳이고, 혀가 꼬이는 곳은 단어를 바꿀 곳입니다.

마지막 시간에는 각자 완성한 글을 한 편씩 낭독하고 마칩니다. 수업이 끝난 뒤에도 이 노트는 계속 열어 두니 필요할 때 다시 찾아 읽어 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "새 기수 수강 신청을 받습니다"
notice = true
body_md = """
다음 기수 강의를 12월 둘째 주에 시작합니다. 온라인과 오프라인 두 가지로 열고, 오프라인은 자리가 적어 먼저 신청하신 순서로 마감합니다.

일정과 수강료가 궁금하시면 [수강 문의](/p/inquiry)에 남겨 주세요. 하루 안에 답해 드립니다.
"""

[[ops.items]]
title = "강의 노트는 회원만 읽을 수 있습니다"
body_md = """
[강의 노트](/b/notes)는 수강생을 위한 자료라 로그인한 회원만 읽을 수 있습니다. 수강 신청이 확인되면 회원 권한을 열어 드립니다.

노트에 질문이 있으면 글 아래 댓글로 남겨 주세요. 강사가 확인하고 답을 달아 드립니다.
"""

[[ops.items]]
title = "12월 셋째 주 오프라인 수업 장소 변경"
body_md = """
12월 셋째 주 오프라인 수업은 강의실 공사로 같은 건물 다른 층에서 진행합니다. 자세한 위치는 수업 전날 문자로 다시 알려 드립니다.

온라인 수업은 그대로 진행합니다.
"""
