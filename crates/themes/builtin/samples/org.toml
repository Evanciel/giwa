# 기관·단체 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 사업 이름·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "library"

[[ops.items]]
title = "올해 사업 안내서"
image = "desk"
alt = "사업 안내서 예시 그림"
body_md = """
올해 기관이 하는 사업을 한데 모은 안내서입니다. 사업마다 누가 신청할 수 있는지, 언제 신청하는지 적어 두었습니다.

파일은 이 글에 붙여 올려 주세요. 안내서가 바뀌면 새 글을 쓰지 말고 이 글의 파일을 바꾸면 찾기 쉽습니다.
"""

[[ops.items]]
title = "프로그램 참가 신청서 양식"
body_md = """
교육과 행사 참가 신청서 양식입니다. 내려받아 적은 뒤 메일이나 방문으로 내 주세요.

- 한글 파일과 PDF 두 가지로 올려 둡니다.
- 개인정보 수집 동의란에 꼭 서명해 주세요.
"""

[[ops.items]]
title = "지난해 활동 보고서"
image = "desk"
alt = "활동 보고서 예시 그림"
body_md = """
지난 한 해 동안 한 일을 사업별로 정리한 보고서입니다. 함께해 주신 분들께 감사드립니다.

## 담은 내용

- 사업별 진행 내용과 참여 인원
- 예산을 어디에 썼는지
- 다음 해에 고쳐 나갈 점
"""

[[ops.items]]
title = "기관 소개 자료"
body_md = """
기관을 처음 소개할 때 쓰는 짧은 자료입니다. 설립 목적, 주요 사업, 오시는 길을 한 장에 담았습니다.

더 자세한 내용은 [기관 소개](/p/about)에서 보실 수 있습니다.
"""

[[ops.items]]
title = "자원봉사 활동 안내서"
image = "people"
alt = "함께 활동하는 사람들 예시 그림"
body_md = """
자원봉사에 처음 오시는 분께 드리는 안내서입니다. 활동 종류, 신청 방법, 활동하는 날 지켜 주실 것을 적었습니다.

활동 시간 확인서가 필요하면 활동이 끝난 뒤 담당자에게 말씀해 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "faq"

[[ops.items]]
title = "프로그램은 누구나 신청할 수 있나요?"
body_md = """
대부분의 프로그램은 누구나 신청할 수 있습니다. 다만 대상이 정해진 사업은 안내서에 신청 자격을 따로 적어 두었습니다.

[공지사항](/b/notice)의 모집 글을 먼저 확인해 주세요.
"""

[[ops.items]]
title = "신청서는 어떻게 내나요?"
body_md = """
[자료실](/b/library)에서 신청서 양식을 내려받아 적은 뒤 메일로 보내시거나 기관에 직접 가져오시면 됩니다.

받은 신청서는 담당자가 확인한 뒤 연락드립니다.
"""

[[ops.items]]
title = "운영 시간은 어떻게 되나요?"
body_md = """
평일 오전 9시부터 오후 6시까지 운영합니다. 점심시간인 낮 12시부터 1시까지는 방문 상담이 어렵습니다.

주말과 공휴일에는 쉽니다. 행사가 있는 날은 공지사항으로 따로 알려 드립니다.
"""

[[ops.items]]
title = "후원은 어떻게 할 수 있나요?"
body_md = """
기관 사무실로 연락 주시면 후원 방법을 안내해 드립니다. 후원금을 어디에 썼는지는 해마다 활동 보고서로 알려 드립니다.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "누리집을 새로 열었습니다"
notice = true
body_md = """
기관 누리집을 새로 열었습니다. 기관이 하는 일은 [기관 소개](/p/about)에서, 양식과 보고서는 [자료실](/b/library)에서 보실 수 있습니다.

궁금한 점은 [자주 묻는 질문](/b/faq)을 먼저 확인해 주세요.
"""

[[ops.items]]
title = "겨울 교육 프로그램 참가자 모집"
body_md = """
겨울 교육 프로그램 참가자를 모집합니다.

- 모집 기간: 12월 1일부터 12월 15일까지
- 교육 기간: 1월 중 4주, 주 1회
- 신청 방법: 자료실의 참가 신청서를 적어 메일로 제출

정원이 차면 일찍 마감할 수 있습니다.
"""

[[ops.items]]
title = "연말 시설 점검으로 하루 쉽니다"
body_md = """
시설 안전 점검을 위해 12월 마지막 주 금요일 하루 문을 닫습니다. 이용에 참고해 주세요.
"""

[[ops.items]]
title = "자원봉사자를 모집합니다"
body_md = """
행사 진행과 안내를 도와주실 자원봉사자를 모집합니다. 활동 내용은 자료실의 자원봉사 활동 안내서를 참고해 주세요.

신청은 기관 사무실로 연락 주시면 됩니다.
"""
