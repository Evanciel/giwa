# 회사 소개 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 일정·내용은 예시다.

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "홈페이지를 새로 열었습니다"
notice = true
image = "city"
alt = "사무실이 있는 도시 풍경 예시 그림"
body_md = """
그동안 찾아 주신 분들께 감사드립니다. 회사 소식과 하는 일을 한곳에서 보실 수 있도록 홈페이지를 새로 열었습니다.

회사가 걸어온 길과 함께 일하는 사람들은 [회사 소개](/p/about)에 정리해 두었습니다. 궁금한 점이나 맡기고 싶은 일이 있으시면 [문의](/p/contact)에 남겨 주세요. 영업일 하루 안에 답해 드립니다.

앞으로 새 서비스와 일정 변경은 이 공지 게시판에 먼저 알려 드리겠습니다.
"""

[[ops.items]]
title = "연말 휴무 안내"
body_md = """
연말을 맞아 아래 기간 동안 사무실 문을 닫습니다.

- 휴무: 12월 31일부터 1월 1일까지
- 업무 재개: 1월 2일 오전 9시

휴무 중에 남겨 주신 문의는 업무를 다시 시작하는 날부터 차례로 답해 드립니다. 급한 일은 휴무 전날까지 연락 주시면 미리 챙기겠습니다.
"""

[[ops.items]]
title = "상담 예약 방법이 바뀝니다"
image = "desk"
alt = "상담 책상 예시 그림"
body_md = """
지금까지는 전화로만 상담 날짜를 잡았는데, 이제 [문의](/p/contact)에서 바라는 날짜와 시간을 함께 남기실 수 있습니다.

## 이렇게 진행됩니다

1. 문의에 하고 싶은 일과 바라는 날짜를 적어 주세요.
2. 담당자가 하루 안에 가능한 시간을 메일로 알려 드립니다.
3. 정해진 시간에 방문하시거나 화상으로 만납니다.

처음 상담은 비용 없이 한 시간 안팎으로 진행합니다.
"""

[[ops.items]]
title = "사무실 이전 안내"
body_md = """
더 넓은 곳에서 손님을 맞기 위해 사무실을 옮깁니다. 옮긴 뒤 주소와 오시는 길은 [회사 소개](/p/about) 아래쪽에 바로 고쳐 두겠습니다.

- 이전 날짜: 12월 첫째 주 주말
- 이전 주간에는 방문 상담을 잠시 쉬고 화상 상담만 받습니다.

전화번호와 메일 주소는 그대로입니다.
"""
