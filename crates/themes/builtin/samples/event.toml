# 행사 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 날짜·장소·참가비는 예시다.

[[ops]]
op = "posts.ensure"
board = "events"

[[ops.items]]
title = "연말 네트워킹 저녁 모임"
image = "people"
alt = "모여서 이야기하는 사람들 예시 그림"
meta = { starts = "2026-12-18", deadline = "2026-12-11", place = "본관 2층 라운지", fee = "20,000원 (저녁 식사 포함)" }
body_md = """
한 해를 마무리하며 편하게 인사 나누는 저녁 자리를 엽니다. 처음 오시는 분도 어색하지 않도록 운영진이 자리를 안내해 드립니다.

- 시간: 저녁 7시부터 9시까지
- 인원: 40명

참가하시려면 [참가 신청](/p/apply)에 이름과 연락처를 남겨 주세요. 자리가 확정되면 문자로 알려 드립니다.
"""

[[ops.items]]
title = "새해 계획 세우기 워크숍"
image = "desk"
alt = "노트를 펼친 책상 예시 그림"
meta = { starts = "2027-01-09", deadline = "2027-01-03", place = "별관 세미나실", fee = "15,000원" }
body_md = """
지난해를 돌아보고 새해 목표를 작게 쪼개 보는 두 시간짜리 워크숍입니다. 활동지와 필기구는 준비해 두니 몸만 오시면 됩니다.

## 이런 순서로 진행합니다

1. 지난 한 해 돌아보기
2. 올해 꼭 하고 싶은 일 세 가지 고르기
3. 첫 달에 할 일로 나누기
"""

[[ops.items]]
title = "겨울 온라인 공개 강연"
image = "abstract"
alt = "강연을 나타낸 추상 예시 그림"
meta = { starts = "2027-01-23", deadline = "2027-01-21", place = "온라인 화상 강연", fee = "무료" }
body_md = """
집에서 편하게 들을 수 있는 공개 강연입니다. 신청하신 분께 행사 전날 접속 주소를 메일로 보내 드립니다.

강연이 끝난 뒤 30분 동안 질문을 받습니다. 미리 묻고 싶은 내용이 있으면 신청할 때 함께 적어 주세요.
"""

[[ops.items]]
title = "봄맞이 야외 걷기 행사"
image = "landscape"
alt = "산책길이 있는 풍경 예시 그림"
meta = { starts = "2027-03-27", deadline = "2027-03-20", place = "시민공원 정문 앞 집결", fee = "5,000원 (기념품 포함)" }
body_md = """
날이 풀리는 3월 끝자락에 함께 걷는 행사를 엽니다. 천천히 걸어 두 시간쯤 걸리는 길이라 누구나 참여할 수 있습니다.

- 편한 신발과 물을 챙겨 주세요.
- 비가 많이 오면 한 주 미루고 미리 연락드립니다.
"""

[[ops.items]]
title = "작은 장터와 나눔 마당"
image = "still"
alt = "장터 물건 예시 그림"
meta = { starts = "2027-05-15", deadline = "2027-04-30", place = "본관 앞 마당", fee = "참가 무료, 판매 자리 10,000원" }
body_md = """
직접 만든 물건이나 쓰지 않는 물건을 나누는 장터를 엽니다. 구경만 하실 분은 신청 없이 오셔도 됩니다.

판매 자리를 원하시면 [참가 신청](/p/apply)에서 신청해 주세요. 자리는 20곳이며 먼저 신청하신 순서로 정합니다.
"""

