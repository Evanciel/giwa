# 숙박·펜션 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 객실 이름·요금은 예시다.

[[ops]]
op = "posts.ensure"
board = "rooms"

[[ops.items]]
title = "솔숲 객실"
image = "room"
alt = "숲이 보이는 객실 예시 그림"
meta = { guests = "2명 / 최대 3명", size = "33㎡", price = "비수기 주중 120,000원부터", features = ["kitchen", "view"] }
body_md = """
창을 열면 소나무 숲이 바로 보이는 2인 객실입니다. 아침에는 새소리에 눈을 뜹니다.

- 퀸 침대 하나
- 간단한 조리 도구와 전기레인지
- 욕실에 샤워 부스
"""

[[ops.items]]
title = "바다 전망 스파 객실"
image = "landscape"
alt = "바다가 보이는 객실 예시 그림"
meta = { guests = "2명 / 최대 2명", size = "40㎡", price = "비수기 주중 180,000원부터", features = ["spa", "view"] }
body_md = """
창가 욕조에 몸을 담그고 바다를 볼 수 있는 객실입니다. 둘이서 조용히 쉬고 싶은 분께 맞습니다.

어린이는 함께 머물 수 없는 객실입니다.
"""

[[ops.items]]
title = "가족 독채"
image = "room"
alt = "가족 독채 예시 그림"
meta = { guests = "4명 / 최대 6명", size = "66㎡", price = "비수기 주중 220,000원부터", features = ["kitchen", "bbq", "view"] }
body_md = """
방 두 개와 넓은 거실이 있는 독채입니다. 앞마당에서 바비큐를 할 수 있습니다.

## 갖춘 것

- 퀸 침대 하나, 이층 침대 하나
- 여섯 명이 함께 쓸 수 있는 식탁과 그릇
- 마당 바비큐 자리(숯과 그릴은 따로 준비해 드립니다)
"""

[[ops.items]]
title = "반려견과 함께 머무는 객실"
image = "landscape"
alt = "마당이 딸린 객실 예시 그림"
meta = { guests = "2명 / 최대 3명", size = "36㎡", price = "비수기 주중 140,000원부터", features = ["pet", "kitchen", "bbq"] }
body_md = """
울타리를 친 작은 마당이 딸린 객실입니다. 반려견과 함께 머물 수 있습니다.

반려견은 두 마리까지이며, 침대 위에는 올라가지 않게 부탁드립니다. 배변 봉투와 수건은 객실에 있습니다.
"""

[[ops.items]]
title = "수영장 앞 객실"
image = "room"
alt = "수영장 앞 객실 예시 그림"
meta = { guests = "4명 / 최대 4명", size = "45㎡", price = "비수기 주중 190,000원부터", features = ["pool", "kitchen", "bbq"] }
body_md = """
문을 열면 바로 야외 수영장이 이어지는 객실입니다. 아이와 함께 오는 가족이 많이 고릅니다.

수영장은 여름철에만 물을 채웁니다. 운영 기간은 [공지](/b/notice)로 알려 드립니다.
"""

[[ops.items]]
title = "다락방 객실"
image = "room"
alt = "다락방 객실 예시 그림"
meta = { guests = "2명 / 최대 4명", size = "30㎡", price = "비수기 주중 110,000원부터", features = ["kitchen"] }
body_md = """
지붕 아래 다락이 있는 아담한 객실입니다. 아이들이 다락에 올라가 노는 것을 좋아합니다.

다락 계단이 가파르니 어린아이는 꼭 함께 올라가 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "reviews"

[[ops.items]]
title = "예시 후기: 창밖 숲이 정말 좋았어요"
image = "landscape"
alt = "숲 풍경 예시 그림"
body_md = """
여행 후기 게시판에 이렇게 사진과 함께 글이 올라옵니다. 이 글은 예시라 실제 숙박 후기가 아닙니다.

머물다 간 손님이 후기를 쓰면 이 자리와 첫 화면에 보입니다.
"""

[[ops.items]]
title = "예시 후기: 아이들이 다락방을 좋아했어요"
image = "room"
alt = "다락방 예시 그림"
body_md = """
예시 후기입니다. 실제 손님의 글이 쌓이면 이 글은 지워 주세요.
"""

[[ops.items]]
title = "예시 후기: 바비큐 하며 보낸 저녁"
image = "food"
alt = "바비큐 저녁 예시 그림"
body_md = """
예시 후기입니다. 사진을 붙이면 목록에서 이렇게 카드로 보입니다. 고쳐 쓰거나 지워 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "예약 전에 꼭 읽어 주세요"
notice = true
body_md = """
입실·퇴실 시간과 환불 기준은 [이용 안내](/p/guide)에 적어 두었습니다. 예약 전에 꼭 읽어 주세요.

예약은 [예약 문의](/p/booking)에 날짜와 인원을 남겨 주시면 빈 객실을 확인해 연락드립니다.
"""

[[ops.items]]
title = "겨울철 바비큐 운영 안내"
body_md = """
겨울에는 바비큐를 저녁 9시까지만 운영합니다. 바람이 강한 날은 안전을 위해 쉴 수 있습니다.

숯과 그릴은 입실할 때 미리 말씀해 주세요.
"""

[[ops.items]]
title = "연말 예약을 받습니다"
body_md = """
연말과 새해 연휴 예약을 받고 있습니다. 주말은 빨리 차니 일찍 문의해 주세요.

연휴 기간에는 2박 이상 예약을 먼저 받습니다.
"""
