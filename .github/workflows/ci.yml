name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            debug: full
          # Linux 는 디버그 정보를 실행 파일 안에 넣어 시험용 바이너리가 200MB 를 넘는다.
          # e2e_release 가 그 파일을 업데이트 파일로 내려받으므로 디버그 정보를 넣지 않는다.
          # 실패한 assert 의 파일·줄은 디버그 정보 없이도 나온다 (ADR-0174).
          - os: ubuntu-latest
            debug: none
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.debug }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml 의 버전을 rustup 이 자동으로 설치한다
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: 품질 게이트
        shell: pwsh
        run: ./scripts/check.ps1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          # RUSTSEC-2026-0459: deny.toml 의 ignore 와 같은 이유 (ADR-0174)
          cargo audit --ignore RUSTSEC-2026-0459
