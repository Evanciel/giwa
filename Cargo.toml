[workspace]
resolver = "3"
members = ["crates/*", "mods/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
maru-core = { path = "crates/core" }
maru-storage = { path = "crates/storage" }
maru-themes = { path = "crates/themes" }
maru-web = { path = "crates/web" }
maru-modules = { path = "crates/modules" }
maru-mod-point = { path = "mods/point" }
maru-mod-reaction = { path = "mods/reaction" }
maru-mod-report = { path = "mods/report" }
maru-mod-message = { path = "mods/message" }
maru-mod-notify = { path = "mods/notify" }
maru-mod-poll = { path = "mods/poll" }
maru-mod-scrap = { path = "mods/scrap" }
maru-mod-ads = { path = "mods/ads" }
maru-mod-consult = { path = "mods/consult" }

# 웹
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout", "set-header"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
# DB: sqlite 피처는 load-extension 까지 켜므로 sqlite-bundled 만 쓴다
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "json"] }
# 표현
minijinja = { version = "3.0.5", features = ["serde"] }
pulldown-cmark = "0.13.6"
ammonia = "4.2.4"
rust-embed = "8.13.0"
# CLI·공통
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.92"
ulid = "3.0.0"
argon2 = "0.6.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "1.1.8"
sha2 = "0.11.1"
# TOTP (RFC 6238) 의 HMAC-SHA1. 표준이 SHA-1 을 정하고 인증 앱 대부분이 SHA-1 만 받는다 (ADR-0072)
hmac = "0.13.0"
sha1 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
# 백업 파일(.tar.gz) 만들기·풀기 (ADR-0063)
tar = "0.4.46"
# 백업 파일을 통째로 읽지 않고 흘려보낸다 (이미 sqlx·axum 이 쓰는 크레이트)
futures-core = "0.3.34"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
percent-encoding = "2.3.2"
# 편지를 SMTP 로 보낸다. TLS 는 rustls(ring) + 운영체제 인증서 저장소. 연결 묶음(pool)·native-tls 는 끔 (S5, ADR-0083)
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
# 링크 카드·나가는 웹훅이 남의 주소를 읽는다. TLS 는 lettre 와 같은 rustls+ring 엔진(기본 엔진으로 깐다),
# 운영체제 인증서 저장소. 운영체제 프록시·HTTP/2 는 쓰지 않는다 (E12, ADR-0084)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# 국내 사이트의 EUC-KR 페이지를 읽는다 (E12)
encoding_rs = "0.8.44"
# 2단계 인증 등록 QR 그림을 서버에서 SVG 로 그린다. 그림 크레이트(image) 기능은 끔 (M16, ADR-0083)
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
unicode-normalization = "0.1.26"
# 개발 의존성
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
