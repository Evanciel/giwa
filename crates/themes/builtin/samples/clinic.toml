# 병원·의원 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 치료 효과를 약속하는 문구는 쓰지 않는다(의료법 제56조).

[[ops]]
op = "posts.ensure"
board = "health"

[[ops.items]]
title = "환절기 목 관리, 이렇게 해 보세요"
image = "still"
alt = "따뜻한 차 예시 그림"
body_md = """
아침저녁으로 기온 차가 커지면 목이 칼칼하다는 분이 많아집니다. 집에서 챙길 수 있는 생활 습관을 정리했습니다.

- 물을 자주 조금씩 마십니다
- 실내가 건조하면 가습기나 젖은 수건으로 습도를 맞춥니다
- 목소리를 많이 쓴 날은 말을 줄이고 쉬어 줍니다

열이 나거나 목 통증이 사흘 넘게 이어지면 혼자 참지 말고 진료를 받으세요.
"""

[[ops.items]]
title = "오래 앉아 일하는 분을 위한 스트레칭"
image = "desk"
alt = "책상 앞 스트레칭 예시 그림"
body_md = """
한자리에 오래 앉아 있으면 목과 어깨, 허리가 뻣뻣해지기 쉽습니다. 한 시간에 한 번은 일어나 몸을 풀어 주세요.

## 자리에서 할 수 있는 동작

1. 어깨를 천천히 뒤로 다섯 번 돌립니다
2. 고개를 좌우로 기울여 10초씩 버팁니다
3. 일어서서 허리를 가볍게 뒤로 젖힙니다

아픈 느낌이 들면 바로 멈추세요. 통증이 계속되면 진료를 받으세요.
"""

[[ops.items]]
title = "건강검진 전날 챙길 것"
image = "room"
alt = "검진실 예시 그림"
body_md = """
건강검진을 앞두고 많이 물어보시는 것을 모았습니다.

- 전날 저녁 9시 뒤로는 물 말고는 드시지 마세요
- 늘 드시는 약이 있으면 검진 전에 미리 알려 주세요
- 편한 옷차림으로 오시면 검사가 수월합니다

검사 항목에 따라 준비할 것이 다를 수 있으니, 예약할 때 안내받은 내용을 꼭 확인해 주세요.
"""

[[ops.items]]
title = "겨울철 손 씻기 다시 보기"
body_md = """
감기와 장염이 흔해지는 철입니다. 손 씻기는 가장 쉬우면서도 꾸준히 하기 어려운 습관입니다.

비누로 손바닥, 손등, 손가락 사이, 손톱 밑까지 30초 넘게 씻어 주세요. 밖에서 돌아왔을 때, 음식을 먹기 전에는 꼭 씻는 것이 좋습니다.
"""

[[ops]]
op = "posts.ensure"
board = "consult"

[[ops.items]]
title = "예시 질문: 처음 가는데 예약해야 하나요?"
body_md = """
온라인 상담 게시판에는 이렇게 회원이 질문을 남깁니다. 이 글은 예시라 실제 질문이 아닙니다.

답변은 병원에서 댓글로 남깁니다. 진료가 필요한 내용은 글로 판단하기 어려우니 방문해 진료를 받으세요.
"""

[[ops.items]]
title = "예시 질문: 토요일에도 검사를 받을 수 있나요?"
body_md = """
예시 질문입니다. 회원만 글을 쓰고 읽을 수 있어 다른 사람에게 보이지 않습니다.

진료시간과 검사 가능한 요일은 [진료 안내](/p/care)에도 적어 두었습니다.
"""

[[ops.items]]
title = "예시 질문: 주차가 되나요?"
body_md = """
예시 질문입니다. 자주 받는 질문은 답을 모아 [병원 소개](/p/about)에 적어 두면 좋습니다.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "진료 예약은 전화로 받습니다"
notice = true
body_md = """
진료 예약과 변경은 전화로 받습니다. 진료시간 안에 연락 주세요.

진료과목과 처음 오실 때 챙길 것은 [진료 안내](/p/care)에 있습니다.
"""

[[ops.items]]
title = "연말연시 진료 일정 안내"
body_md = """
연말연시 진료 일정을 알려 드립니다.

- 12월 31일: 오전 진료만 합니다 (09:00 ~ 13:00)
- 1월 1일: 휴진합니다

1월 2일부터 평소대로 진료합니다. 급한 증상이 있으면 가까운 응급실을 이용해 주세요.
"""

[[ops.items]]
title = "독감 예방접종 안내"
body_md = """
올겨울 독감 예방접종을 하고 있습니다. 접종 대상과 비용은 전화로 문의해 주세요.

접종 당일 열이 나거나 몸이 좋지 않으면 접종을 미루는 것이 좋습니다. 접종 뒤에는 20~30분쯤 병원에서 쉬었다 가세요.
"""

[[ops.items]]
title = "토요일 점심시간 없이 진료합니다"
body_md = """
토요일은 점심시간 없이 09:00부터 13:00까지 진료합니다. 접수는 진료 마감 30분 전에 끝납니다.
"""
