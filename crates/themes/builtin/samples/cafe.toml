# 가게 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 메뉴·가격·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "photo"

[[ops.items]]
title = "아침에 갓 구운 소금빵"
image = "food"
alt = "소금빵 예시 그림"
body_md = """
매일 아침 8시에 첫 판을 구워 냅니다. 겉은 바삭하고 속은 버터 향이 가득합니다.

오후 늦게 오시면 다 팔리고 없을 때가 많습니다. 꼭 드시고 싶으면 전날 미리 말씀해 주세요.
"""

[[ops.items]]
title = "창가 자리"
image = "room"
alt = "창가 자리 예시 그림"
body_md = """
오후 두세 시쯤 햇볕이 가장 잘 드는 창가 자리입니다. 혼자 책 읽으러 오시는 분들이 많이 앉으십니다.

자리마다 콘센트가 있어 노트북을 쓰셔도 됩니다.
"""

[[ops.items]]
title = "오늘의 핸드드립"
image = "still"
alt = "핸드드립 커피 예시 그림"
body_md = """
이번 주 핸드드립 원두는 꽃향과 단맛이 도는 밝은 원두입니다. 식으면서 맛이 조금씩 바뀌니 천천히 드셔 보세요.

원두는 주마다 바꾸며, 카운터 칠판에 그 주 원두를 적어 둡니다.
"""

[[ops.items]]
title = "바스크 치즈케이크"
image = "food"
alt = "치즈케이크 예시 그림"
body_md = """
겉은 진하게 태우고 속은 부드럽게 구운 치즈케이크입니다. 하루에 두 판만 굽습니다.

통으로 사 가실 분은 이틀 전까지 주문해 주세요.
"""

[[ops.items]]
title = "큰 탁자가 있는 안쪽 자리"
image = "room"
alt = "안쪽 자리 예시 그림"
body_md = """
여섯 명까지 앉을 수 있는 큰 탁자를 안쪽에 두었습니다. 작은 모임이나 공부 모임에 쓰기 좋습니다.

주말에는 자리가 금방 차니 여럿이 오실 때는 미리 연락 주세요.
"""

[[ops.items]]
title = "가게 앞 골목 풍경"
image = "city"
alt = "가게 앞 골목 예시 그림"
body_md = """
가게 앞 골목은 해 질 무렵이 가장 예쁩니다. 날이 좋은 날에는 바깥 의자도 내어 둡니다.

반려견과 함께 오시면 바깥 자리를 안내해 드립니다.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "가게 문을 열었습니다"
notice = true
body_md = """
동네에 작은 카페를 열었습니다. 그날 내린 커피와 아침에 구운 빵을 준비해 두겠습니다.

영업시간과 메뉴는 첫 화면에서 보실 수 있습니다. 매장 사진은 [사진](/b/photo) 게시판에 올려 두었습니다.
"""

[[ops.items]]
title = "겨울 메뉴가 나왔습니다"
image = "food"
alt = "겨울 메뉴 예시 그림"
body_md = """
날이 추워져 따뜻한 메뉴 두 가지를 더했습니다.

- 생강 라테 5,500원
- 뱅쇼 (알코올을 날린 것) 6,000원

겨울 메뉴는 3월까지 냅니다.
"""

[[ops.items]]
title = "연말 휴무 안내"
body_md = """
연말에는 아래 날짜에 쉽니다.

- 12월 31일: 오후 5시에 일찍 닫습니다
- 1월 1일: 쉽니다

1월 2일부터 평소처럼 문을 엽니다. 한 해 동안 찾아 주셔서 고맙습니다.
"""

[[ops.items]]
title = "개인 컵을 가져오시면 300원 빼 드려요"
body_md = """
일회용 컵을 줄이려고 개인 컵 할인을 시작했습니다. 텀블러나 머그를 가져오시면 음료값에서 300원을 빼 드립니다.

컵이 깨끗하지 않으면 한 번 헹군 뒤 담아 드립니다.
"""
