# 병원·의원 (ADR-0139). 진료 안내·진료시간·의료진·오시는 길이 첫 화면이다.
# 의료법 제56조와 시행령 제23조는 치료경험담 등 치료 효과를 오인하게 할 광고를 금지한다.
# 그래서 후기 블록·후기 게시판을 두지 않고, 효과를 약속하는 문구를 쓰지 않는다. 글자는 예시다.
id = "clinic"
name = "병원·의원"
description = "진료시간·진료과목·의료진·오시는 길 첫 화면, 공지, 건강 정보, 회원 상담 게시판"
theme_note = "맑은 청록 파랑, 밝고 차분한 바탕"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#f9fcfd", fg = "#13232b", primary = "#0b6a84", muted = "#4f6169", surface = "#ffffff", border = "#dce8ec" }, color_dark = { bg = "#0f171b", fg = "#e5eff2", primary = "#79cde3", muted = "#9badb4", surface = "#162127", border = "#26343b" }, radius = { sm = 8, md = 12, lg = 18 }, layout = { max_width = 1120 } }

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지"
kind = "notice"
sort_order = 0

[[ops]]
op = "board.ensure"
slug = "health"
name = "건강 정보"
kind = "blog"
layout = "webzine"
sort_order = 1
policy = { write = "editor", comment = "none" }

[[ops]]
op = "board.ensure"
slug = "consult"
name = "온라인 상담"
kind = "qna"
layout = "list"
sort_order = 2
policy = { list = "member", read = "member", write = "member", comment = "editor" }

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
