<div class="pl-groups">
  {% for g in w.data.groups %}<div>
    {% if g.name %}<h3 class="pl-name">{{ g.name }}</h3>{% endif %}
    <ul class="pl-list">
      {% for i in g.items %}<li>
        <div class="pl-row"><b>{{ i.name }}</b>{% if i.price %}<i aria-hidden="true"></i><span>{{ i.price }}</span>{% endif %}</div>
        {% if i.note %}<p class="pl-note">{{ i.note }}</p>{% endif %}
      </li>{% endfor %}
    </ul>
  </div>{% endfor %}
</div>
{% if w.data.note %}<p class="sec-note">{{ w.data.note }}</p>{% endif %}
