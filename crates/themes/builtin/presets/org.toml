# 기관·단체 (SPEC §8.6, ADR-0126). 글자는 예시다. 에이전트가 기관 정보로 바꾼다.
id = "org"
name = "기관·단체"
description = "공지·자료실·자주 묻는 질문 게시판, 인사말·연혁·조직도·오시는 길"
theme_note = "숲 초록에 단정한 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fbfcfb", fg = "#17211c", primary = "#1c5d42", muted = "#55615a", surface = "#ffffff", border = "#dfe6e1" }, color_dark = { bg = "#121714", fg = "#e8eeea", primary = "#83cfa9", muted = "#9fada5", surface = "#19201c", border = "#2a342e" }, radius = { sm = 4, md = 6, lg = 10 }, layout = { max_width = 1200 } }

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지사항"
kind = "notice"
layout = "list"
sort_order = 0

[[ops]]
op = "board.ensure"
slug = "library"
name = "자료실"
kind = "free"
layout = "list"
sort_order = 1
policy = { write = "editor", comment = "none" }

[[ops]]
op = "board.ensure"
slug = "faq"
name = "자주 묻는 질문"
kind = "faq"
sort_order = 2

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "about"
title = "기관 소개"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "단체가 하는 일과 사업, 소식, 참여 방법을 알립니다.", home_page = "home" }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "기관 소개", link = { kind = "page", slug = "about" } },
  { label = "공지사항", link = { kind = "board", slug = "notice" } },
  { label = "자료실", link = { kind = "board", slug = "library" } },
  { label = "자주 묻는 질문", link = { kind = "board", slug = "faq" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { tone = "soft", eyebrow = "이웃과 함께 배우고 나누는 지역 비영리 단체", button = { label = "기관 소개", link = "/p/about" }, button2 = { label = "자료실", link = "/b/library" } } },
  { kind = "latest_posts", region = "main", scope = "home", title = "공지사항", config = { board = "notice", limit = 6 } },
  { kind = "latest_posts", region = "main", scope = "home", title = "자료실", config = { board = "library", limit = 6 } },
  { kind = "features", region = "main", scope = "home", title = "주요 사업", config = { style = "cards", tone = "soft", items = [
    { title = "배움 프로그램", text = "어린이부터 어르신까지 누구나 들을 수 있는 강좌와 모임을 엽니다." },
    { title = "돌봄과 나눔", text = "도움이 필요한 이웃을 찾아가 생활을 살피고 필요한 것을 나눕니다." },
    { title = "자원봉사", text = "주민이 직접 참여하는 봉사 활동을 계절마다 마련합니다." },
  ] } },
  { kind = "hero", region = "main", scope = "page:about", config = { title = "기관 소개", text = "이웃이 서로 배우고 기대는 마을을 만들고자 세운 단체입니다. 교육과 돌봄, 자원봉사로 지역과 함께합니다." } },
  { kind = "image_text", region = "main", scope = "page:about", title = "인사말", config = { body = "누리집을 찾아 주셔서 고맙습니다.\n\n저희는 가까운 이웃이 서로 배우고 기댈 수 있는 자리를 만들고자 이 일을 시작했습니다. 앞으로도 주민 여러분의 이야기를 듣고 함께 움직이겠습니다." } },
  { kind = "timeline", region = "main", scope = "page:about", title = "연혁", config = { tone = "soft", items = [
    { date = "2009년", title = "기관 설립" },
    { date = "2014년", title = "주요 사업 시작" },
    { date = "2022년", title = "지금의 건물로 이전" },
  ] } },
  { kind = "org_chart", region = "main", scope = "page:about", title = "조직도", config = { nodes = [
    { name = "기관장", children = [
      { name = "총무과" },
      { name = "사업과", children = [{ name = "사업 1팀" }, { name = "사업 2팀" }] },
      { name = "홍보과" },
    ] },
  ] } },
  { kind = "visit", region = "main", scope = "page:about", title = "오시는 길", config = { tone = "soft", address = "주소를 적어 주세요", phone = "02-000-0000", transit = "지하철역에서 걸어서 5분입니다." } },
]
