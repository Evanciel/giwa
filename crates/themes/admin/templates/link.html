{% extends "_base.html" %}
{% block title %}로그인 확인{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>로그인 확인</h1>
<p><strong>{{ email }}</strong> 계정으로 로그인합니다. 이 링크는 한 번만 쓸 수 있습니다.</p>
<form method="post" action="{{ action }}" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <button type="submit">로그인</button>
</form>
{% endblock %}
