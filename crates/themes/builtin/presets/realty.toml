# 부동산 중개 (ADR-0139). 매물은 카드형 게시판 글이고 거래 종류·매물 종류 칸으로 거른다.
# 공인중개사법 제18조의2와 국토교통부 고시가 매물 표시·광고 명시사항을 정한다. 칸과 바닥글은 그 자리를
# 마련한 것이고, 정확한 항목은 운영자가 최신 고시로 확인한다. 글자는 예시다.
id = "realty"
name = "부동산 중개"
description = "매물 카드 목록(거래 종류·매물 종류·명시사항 칸), 매물 내놓기·문의, 중개사 소개, 바닥글 사무소 정보"
theme_note = "짙은 남색에 단정한 작은 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fbfbfc", fg = "#141a26", primary = "#1e3a6e", muted = "#535b6a", surface = "#ffffff", border = "#e0e3ea" }, color_dark = { bg = "#10131a", fg = "#e8ebf2", primary = "#9cb5e6", muted = "#a0a7b5", surface = "#171b24", border = "#2a2f3b" }, radius = { sm = 4, md = 8, lg = 12 }, layout = { max_width = 1200 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "listings"
name = "매물"
kind = "gallery"
layout = "card"
sort_order = 0
policy = { write = "editor", comment = "none" }
field_schema = [
  { key = "deal", label = "거래 종류", type = "select", required = true, list = true, filter = true, options = [{ value = "sale", label = "매매" }, { value = "jeonse", label = "전세" }, { value = "monthly", label = "월세" }] },
  { key = "type", label = "매물 종류", type = "select", required = true, list = true, filter = true, options = [{ value = "apt", label = "아파트" }, { value = "villa", label = "빌라·다세대" }, { value = "officetel", label = "오피스텔" }, { value = "oneroom", label = "원룸" }, { value = "store", label = "상가·사무실" }, { value = "land", label = "토지" }] },
  { key = "price", label = "가격", type = "text", required = true, list = true, help = "매매가, 보증금, 월세를 적습니다. 예: 보증금 1,000만 원 / 월 55만 원" },
  { key = "address", label = "소재지", type = "text", required = true, list = true, help = "동·리까지 적습니다." },
  { key = "area", label = "전용면적", type = "text", required = true, list = true, help = "예: 00.00㎡" },
  { key = "floor", label = "해당 층 / 총 층", type = "text", help = "예: 3층 / 15층" },
  { key = "rooms", label = "방 / 욕실 수", type = "text", help = "예: 3개 / 2개" },
  { key = "direction", label = "방향", type = "text", help = "기준이 되는 곳을 함께 적습니다. 예: 남향(거실 기준)" },
  { key = "approved", label = "사용승인일", type = "date" },
  { key = "movein", label = "입주 가능일", type = "text", help = "예: 즉시, 협의" },
  { key = "maintenance", label = "관리비", type = "text" },
  { key = "parking", label = "주차", type = "text" },
  { key = "closed", label = "거래 완료", type = "boolean", list = true, filter = true },
]

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지"
kind = "notice"
sort_order = 1

[[ops]]
op = "board.ensure"
slug = "news"
name = "동네·부동산 소식"
kind = "blog"
layout = "list"
sort_order = 2
policy = { write = "editor", comment = "member" }

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "about"
title = "중개사무소 소개"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "contact"
title = "매물 내놓기·문의"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { home_page = "home", show_search = true }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "매물", link = { kind = "board", slug = "listings" } },
  { label = "중개사무소 소개", link = { kind = "page", slug = "about" } },
  { label = "동네·부동산 소식", link = { kind = "board", slug = "news" } },
  { label = "공지", link = { kind = "board", slug = "notice" } },
  { label = "매물 내놓기·문의", link = { kind = "page", slug = "contact" } },
]

