# 제품 문서 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 버전 번호와 바뀐 점은 예시다. 제품의 실제 변경 기록으로 바꿔 쓴다.

[[ops]]
op = "posts.ensure"
board = "changelog"

[[ops.items]]
title = "버전 1.4 바뀐 점"
body_md = """
설정 화면을 다시 정리하고 자주 묻던 불편을 고쳤습니다.

## 새로 생긴 것

- 설정을 파일로 내보내고 다시 불러올 수 있습니다.
- 검색창에서 문서 제목뿐 아니라 본문도 찾습니다.

## 고친 것

- 긴 이름을 넣으면 목록이 옆으로 밀리던 문제
- 어두운 화면에서 일부 글자가 잘 보이지 않던 문제

올리는 방법은 [설치](/p/install)의 업데이트 항목을 보세요.
"""

[[ops.items]]
title = "버전 1.3.2 바뀐 점"
body_md = """
작은 수정 버전입니다. 1.3 을 쓰고 있다면 바로 올리는 것을 권합니다.

## 고친 것

- 처음 실행할 때 설정 파일이 없으면 멈추던 문제
- 시간대가 다른 환경에서 날짜가 하루 어긋나 보이던 문제

바뀐 설정은 없습니다. 올린 뒤 따로 할 일도 없습니다.
"""

[[ops.items]]
title = "버전 1.3 바뀐 점"
body_md = """
여러 사람이 함께 쓰는 환경을 위한 기능을 더했습니다.

## 새로 생긴 것

- 사용자마다 권한을 나누어 줄 수 있습니다.
- 누가 언제 무엇을 바꿨는지 기록으로 남습니다.

## 달라진 것

- 기본 저장 위치가 바뀌었습니다. 예전 위치의 자료는 처음 실행할 때 자동으로 옮겨집니다.

권한 나누는 법은 [길잡이](/p/guides)에 새로 정리해 두었습니다.
"""

[[ops.items]]
title = "버전 1.2 바뀐 점"
body_md = """
처음 쓰는 분이 덜 헤매도록 시작 과정을 손보았습니다.

## 새로 생긴 것

- 처음 실행하면 꼭 필요한 설정만 묻는 안내가 뜹니다.
- 예시 자료를 한 번에 넣고 지울 수 있습니다.

## 고친 것

- 창 크기를 줄이면 메뉴가 겹치던 문제

처음이라면 [처음 해 보기](/p/first-steps)부터 따라 해 보세요.
"""

[[ops.items]]
title = "버전 1.0 첫 공개"
body_md = """
첫 안정 버전을 공개합니다. 시험판을 써 주시고 의견을 보내 주신 분들께 감사드립니다.

## 담긴 것

- 기본 기능 전체
- 설치 안내와 시작 문서
- 자주 묻는 질문 모음

막히는 곳이 있으면 [자주 묻는 질문](/p/faq)을 먼저 봐 주세요. 앞으로 바뀌는 점은 이 변경 기록에 버전마다 남깁니다.
"""
