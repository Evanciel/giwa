op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "우리 동네 아파트와 빌라, 상가를 직접 보고 소개합니다", button = { label = "매물 보기", link = "/b/listings?f.closed=0" }, button2 = { label = "매물 내놓기", link = "/p/contact" } } },
  { kind = "features", region = "main", scope = "home", title = "어떤 집을 찾으세요", config = { style = "tiles", items = [
    { title = "아파트", link = "/b/listings?f.type=apt&f.closed=0" },
    { title = "빌라·다세대", link = "/b/listings?f.type=villa&f.closed=0" },
    { title = "오피스텔", link = "/b/listings?f.type=officetel&f.closed=0" },
    { title = "원룸", link = "/b/listings?f.type=oneroom&f.closed=0" },
    { title = "상가·사무실", link = "/b/listings?f.type=store&f.closed=0" },
    { title = "토지", link = "/b/listings?f.type=land&f.closed=0" },
  ] } },
  { kind = "features", region = "main", scope = "home", title = "거래 종류", config = { style = "tiles", tone = "soft", items = [
    { title = "매매", text = "사고파는 매물", link = "/b/listings?f.deal=sale&f.closed=0" },
    { title = "전세", text = "전세 매물", link = "/b/listings?f.deal=jeonse&f.closed=0" },
    { title = "월세", text = "월세 매물", link = "/b/listings?f.deal=monthly&f.closed=0" },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "새로 나온 매물", config = { board = "listings", limit = 6, view = "card" } },
  { kind = "features", region = "main", scope = "home", title = "중개 순서", config = { style = "steps", tone = "soft", items = [
    { title = "상담", text = "원하는 지역, 예산, 입주 시기를 듣습니다." },
    { title = "매물 보기", text = "조건에 맞는 매물을 함께 봅니다." },
    { title = "확인", text = "등기부와 건축물대장을 함께 확인합니다." },
    { title = "계약", text = "계약서와 확인·설명서를 드립니다." },
  ] } },
  { kind = "post_tabs", region = "main", scope = "home", title = "소식", config = { limit = 4, tabs = [
    { label = "동네·부동산 소식", board = "news" },
    { label = "공지", board = "notice" },
  ] } },
  { kind = "visit", region = "main", scope = "home", title = "오시는 길", config = { name = "중개사무소 이름", address = "주소를 적어 주세요", phone = "02-000-0000", transit = "지하철역에서 걸어서 5분, 버스 정류장 바로 앞입니다." } },
  { kind = "hero", region = "main", scope = "page:about", config = { title = "중개사무소 소개", text = "어느 지역을 얼마나 오래 다뤘는지 사실대로 적습니다." } },
  { kind = "team", region = "main", scope = "page:about", title = "중개사", config = { items = [
    { name = "이름을 적어 주세요", role = "대표 공인중개사", bio = "아파트와 빌라 매매·전세를 주로 맡습니다. 계약 전 서류 확인을 꼼꼼히 챙깁니다." },
    { name = "이름을 적어 주세요", role = "소속 공인중개사", bio = "원룸·오피스텔 월세와 상가·사무실 임대를 주로 맡습니다." },
  ] } },
  { kind = "visit", region = "main", scope = "page:about", title = "오시는 길", config = { name = "중개사무소 이름", address = "주소를 적어 주세요", phone = "02-000-0000", parking = "사무소 앞에 잠시 세울 자리가 있습니다. 오시기 전에 전화 주시면 안내해 드립니다." } },
  { kind = "hero", region = "main", scope = "page:contact", config = { title = "매물 내놓기·문의", text = "내놓을 매물이나 찾는 조건을 남겨 주세요." } },
  { kind = "contact_form", region = "main", scope = "page:contact", config = { form = "contact", purpose = "매물 상담 연락", fields = [
    { key = "name", label = "이름", required = true },
    { key = "contact", label = "연락처", type = "tel", required = true },
    { key = "kind", label = "문의 종류", type = "select", required = true, options = ["매물 내놓기", "매물 찾기", "그 밖의 문의"] },
    { key = "deal", label = "거래 종류", type = "select", options = ["매매", "전세", "월세"] },
    { key = "message", label = "지역·예산·조건", type = "textarea", required = true },
  ] } },
  { kind = "markdown_block", region = "footer", scope = "all", config = { body = "중개사무소 이름 · 대표 공인중개사 이름을 적어 주세요 · 주소를 적어 주세요\n\n전화 02-000-0000 · 중개사무소 등록번호 00000-0000-00000 · 사업자등록번호 000-00-00000" } },
]
