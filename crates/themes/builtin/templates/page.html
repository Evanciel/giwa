{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ site.name }}{% endblock %}
{% block description %}{{ page.summary }}{% endblock %}
{% block main %}
<article class="page page--{{ page.layout }}">
  <header>
    <h1>{{ page.title }}</h1>
  </header>
  {# body_html 은 서버가 ammonia 로 정화한 값만 들어온다. #}
  <div class="prose">{{ page.body_html | safe }}</div>
</article>
{% endblock %}
