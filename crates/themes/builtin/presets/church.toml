# 교회·종교 단체 (ADR-0139). 예배·모임 시간, 말씀, 주보·자료, 소식, 새가족 안내가 중심이다.
# 성당·절 같은 다른 종교 단체도 게시판 이름만 바꿔 쓴다. 글자는 예시다.
id = "church"
name = "교회"
description = "예배·모임 시간, 말씀, 주보·자료실, 교회 소식, 섬기는 분들, 새가족 안내, 오시는 길"
theme_note = "포근한 미색 바탕에 짙은 포도주색"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fcfaf8", fg = "#221a1b", primary = "#7b2d3b", muted = "#645a5b", surface = "#ffffff", border = "#ebe2e0" }, color_dark = { bg = "#171213", fg = "#f1eae9", primary = "#e3a1ac", muted = "#b1a5a6", surface = "#201a1b", border = "#372e2f" }, radius = { sm = 6, md = 12, lg = 20 }, layout = { max_width = 1100 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "sermons"
name = "말씀"
kind = "blog"
layout = "webzine"
sort_order = 0
policy = { write = "editor", comment = "member" }
field_schema = [
  { key = "service", label = "예배", type = "select", list = true, filter = true, options = [{ value = "sunday", label = "주일 예배" }, { value = "wednesday", label = "수요 예배" }, { value = "dawn", label = "새벽 기도" }, { value = "special", label = "특별 집회" }] },
  { key = "preacher", label = "설교자", type = "text", list = true },
  { key = "verse", label = "성경 본문", type = "text", list = true, help = "예: 책 3장 1~6절" },
  { key = "video", label = "영상 주소", type = "url" },
]

[[ops]]
op = "board.ensure"
slug = "bulletin"
name = "주보·자료"
kind = "notice"
layout = "list"
sort_order = 1
policy = { write = "editor", comment = "none" }

[[ops]]
op = "board.ensure"
slug = "news"
name = "교회 소식"
kind = "gallery"
layout = "gallery"
sort_order = 2
policy = { write = "editor", comment = "member" }

[[ops]]
op = "board.ensure"
slug = "programs"
name = "교육·훈련"
kind = "blog"
layout = "list"
sort_order = 3
policy = { write = "editor", comment = "member" }
field_schema = [
  { key = "target", label = "대상", type = "text", list = true, help = "예: 새가족, 청년, 누구나" },
  { key = "deadline", label = "신청 마감", type = "date", role = "deadline", list = true, filter = true },
  { key = "schedule", label = "모이는 때", type = "text", help = "예: 3월 7일부터 매주 토요일 10:00, 8주" },
  { key = "place", label = "장소", type = "text" },
]

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "about"
title = "교회 소개"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "welcome"
title = "새가족 안내"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "함께 예배하고 이웃과 나누는 교회입니다. 예배 안내와 교회 소식을 전합니다.", home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "교회 소개", link = { kind = "page", slug = "about" } },
  { label = "말씀", link = { kind = "board", slug = "sermons" } },
  { label = "주보·자료", link = { kind = "board", slug = "bulletin" } },
  { label = "교회 소식", link = { kind = "board", slug = "news" } },
  { label = "교육·훈련", link = { kind = "board", slug = "programs" } },
  { label = "새가족 안내", link = { kind = "page", slug = "welcome" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "말씀 위에 서고 사랑으로 함께하는 교회", button = { label = "예배 안내", link = "/p/about" }, button2 = { label = "새가족 안내", link = "/p/welcome" } } },
  { kind = "features", region = "main", scope = "home", config = { style = "tiles", items = [
    { title = "새가족 안내", link = "/p/welcome" },
    { title = "예배 시간", link = "/p/about" },
    { title = "말씀", link = "/b/sermons" },
    { title = "주보", link = "/b/bulletin" },
    { title = "교육·훈련", link = "/b/programs?f.deadline=open" },
    { title = "오시는 길·주차", link = "/p/about" },
  ] } },
  { kind = "hours", region = "main", scope = "home", title = "예배·모임 시간", config = { tone = "soft", note = "절기와 행사에 따라 바뀌면 교회 소식으로 알립니다.", rows = [
    { days = "주일 1부 예배", time = "09:00" },
    { days = "주일 2부 예배", time = "11:00" },
    { days = "수요 예배", time = "19:30" },
    { days = "새벽 기도", time = "05:30 (월~금)" },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "말씀", config = { board = "sermons", limit = 3, view = "card" } },
  { kind = "latest_posts", region = "main", scope = "home", title = "주보·자료", config = { board = "bulletin", limit = 4 } },
  { kind = "latest_posts", region = "main", scope = "home", title = "교육·훈련", config = { board = "programs", limit = 4 } },
  { kind = "gallery_grid", region = "main", scope = "home", title = "교회 소식", config = { board = "news", limit = 6, columns = 3 } },
  { kind = "cta", region = "main", scope = "home", title = "처음 오셨나요", config = { text = "새가족 안내에 연락처를 남겨 주시면 환영하며 안내해 드립니다.", button = { label = "새가족 안내", link = "/p/welcome" } } },
  { kind = "visit", region = "main", scope = "home", title = "오시는 길", config = { name = "교회 이름", address = "주소를 적어 주세요", phone = "02-000-0000", transit = "지하철역에서 걸어서 5분, 버스 정류장 바로 앞입니다.", parking = "교회 앞 주차장을 쓰실 수 있고, 주일에는 안내 위원이 자리를 안내해 드립니다." } },
  { kind = "hero", region = "main", scope = "page:about", config = { title = "교회 소개", text = "말씀과 기도로 함께 자라 가는 공동체입니다. 처음 오신 분도 가족처럼 맞이합니다." } },
  { kind = "image_text", region = "main", scope = "page:about", title = "인사말", config = { body = "교회 홈페이지를 찾아 주셔서 반갑습니다. 저희는 말씀 안에서 서로 돌보고, 이웃과 함께 살아가는 교회가 되기를 바랍니다.\n\n처음 오시는 분도 편하게 머무실 수 있도록 늘 문을 열어 두겠습니다. 언제든 찾아 주세요." } },
  { kind = "team", region = "main", scope = "page:about", title = "섬기는 분들", config = { tone = "soft", items = [
    { name = "이름을 적어 주세요", role = "담임목사" },
    { name = "이름을 적어 주세요", role = "부목사 · 청년부" },
    { name = "이름을 적어 주세요", role = "전도사 · 교회학교" },
  ] } },
  { kind = "timeline", region = "main", scope = "page:about", title = "걸어온 길", config = { items = [
    { date = "1998년", title = "교회 설립" },
    { date = "2012년", title = "지금 예배당으로 옮김" },
  ] } },
  { kind = "hours", region = "main", scope = "page:about", title = "예배·모임 시간", config = { rows = [
    { days = "주일 1부 예배", time = "09:00" },
    { days = "주일 2부 예배", time = "11:00" },
    { days = "수요 예배", time = "19:30" },
    { days = "새벽 기도", time = "05:30 (월~금)" },
  ] } },
  { kind = "markdown_block", region = "main", scope = "page:about", title = "헌금 안내", config = { body = "헌금 계좌: 은행 이름 000-000-000000 (예금주 교회 이름)\n\n기부금 영수증은 해마다 1월에 신청을 받아 발급합니다. 교회 사무실에 전화나 방문으로 신청해 주세요." } },
  { kind = "hero", region = "main", scope = "page:welcome", config = { title = "새가족 안내", text = "처음 오신 분을 환영합니다. 연락처를 남겨 주시면 안내해 드립니다." } },
  { kind = "features", region = "main", scope = "page:welcome", title = "처음 오시면", config = { style = "steps", items = [
    { title = "예배 참석", text = "안내 위원이 자리를 안내합니다." },
    { title = "새가족 등록", text = "등록 카드를 쓰거나 아래에 남깁니다." },
    { title = "새가족 모임", text = "몇 주 동안 교회를 소개하는 모임에 함께합니다." },
  ] } },
  { kind = "contact_form", region = "main", scope = "page:welcome", config = { form = "welcome", purpose = "새가족 안내 연락", submit = "남기기", done = "잘 받았습니다. 환영하며 연락드리겠습니다.", fields = [
    { key = "name", label = "이름", required = true },
    { key = "contact", label = "연락처", type = "tel", required = true },
    { key = "visit", label = "처음 오실 날", type = "date" },
    { key = "message", label = "하고 싶은 말", type = "textarea" },
  ] } },
