# 커뮤니티 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 회원 글처럼 보이는 글도 모두 예시다.

[[ops]]
op = "posts.ensure"
board = "free"

[[ops.items]]
title = "가입 인사 드립니다"
body_md = """
눈팅만 하다가 처음 글 남겨요. 관심사가 비슷한 분들이 많아서 반갑습니다.

앞으로 자주 들를게요. 잘 부탁드립니다!
"""

[[ops.items]]
title = "오늘 첫눈 온 곳 있나요?"
image = "landscape"
alt = "눈 내린 풍경 예시 그림"
body_md = """
아침에 창밖을 보니 눈발이 조금 날리더라고요. 금방 그쳤지만 그래도 첫눈이라 반가웠습니다.

다른 지역은 어떤가요?
"""

[[ops.items]]
title = "요즘 퇴근길에 듣는 노래"
body_md = """
퇴근길에 잔잔한 피아노 곡을 듣고 있어요. 하루 종일 시끄러웠던 머리가 조금 가라앉는 느낌입니다.

여러분은 요즘 뭐 들으세요? 추천 받아요.
"""

[[ops.items]]
title = "주말에 뭐 하세요?"
body_md = """
이번 주말은 아무 계획 없이 집에서 쉬려고요. 밀린 빨래하고 책이나 좀 읽을까 합니다.

다들 주말 계획 있으신가요?
"""

[[ops.items]]
title = "동네 빵집에서 산 식빵이 너무 맛있어요"
image = "food"
alt = "식빵 예시 그림"
body_md = """
산책하다 들른 작은 빵집에서 식빵을 샀는데 정말 촉촉하네요. 그냥 뜯어 먹어도 맛있어요.

다들 동네에 아끼는 가게 하나씩 있으시죠?
"""

[[ops]]
op = "posts.ensure"
board = "qna"

[[ops.items]]
title = "글에 사진은 어떻게 올리나요?"
body_md = """
글쓰기 화면에서 사진을 넣고 싶은데 어디서 하는지 모르겠어요. 한 번에 여러 장도 되나요?

아시는 분 알려 주세요.
"""

[[ops.items]]
title = "알림을 끄고 싶어요"
body_md = """
댓글이 달릴 때마다 알림이 와서 조금 많네요. 특정 글만 알림을 끌 수 있나요?
"""

[[ops.items]]
title = "장터 거래는 어떻게 하는 게 안전한가요?"
body_md = """
장터에서 처음 물건을 사 보려고 해요. 직접 만나서 거래하는 게 나은지, 택배가 나은지 궁금합니다.

경험 있으신 분들 조언 부탁드려요.
"""

[[ops.items]]
title = "닉네임을 바꿀 수 있나요?"
body_md = """
가입할 때 대충 지은 닉네임이 마음에 안 들어서요. 바꾸는 방법이 있을까요?
"""

[[ops]]
op = "posts.ensure"
board = "tips"

[[ops.items]]
title = "겨울철 집 안 습도 맞추는 방법"
image = "room"
alt = "실내 예시 그림"
body_md = """
난방을 틀면 금방 건조해지죠. 제가 해 보고 괜찮았던 방법을 정리해 봅니다.

- 젖은 수건을 방에 널어 둡니다
- 화분에 물을 넉넉히 줍니다
- 가습기는 매일 물을 갈고 자주 씻습니다

습도계를 하나 두면 감으로 맞추는 것보다 훨씬 편해요.
"""

[[ops.items]]
title = "휴대폰 사진 백업, 이렇게 하고 있어요"
image = "desk"
alt = "책상 위 기기 예시 그림"
body_md = """
사진이 쌓이면 휴대폰 용량이 금방 차더라고요. 저는 한 달에 한 번 날을 정해 정리합니다.

1. 흔들리거나 겹친 사진부터 지웁니다
2. 남길 사진은 컴퓨터와 외장 저장 장치 두 곳에 옮깁니다
3. 옮긴 뒤 휴대폰에서는 지웁니다

두 곳에 나눠 두면 하나가 고장 나도 안심이에요.
"""

[[ops.items]]
title = "장 볼 때 쓰는 목록 정리 요령"
body_md = """
장 보러 가기 전에 냉장고를 먼저 열어 보고 목록을 써요. 마트 동선대로 채소, 고기, 유제품 순서로 적으면 빠뜨리는 게 줄어듭니다.

목록에 없는 건 안 사는 게 제일 어려운 부분입니다.
"""

[[ops.items]]
title = "게시판 처음 쓰시는 분을 위한 안내"
body_md = """
글 목록 위의 검색 칸에서 지난 글을 찾을 수 있어요. 질문하기 전에 한 번 검색해 보면 같은 답이 이미 있을 때가 많습니다.

궁금한 건 [질문답변](/b/qna)에, 사는 이야기는 [자유게시판](/b/free)에 올려 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "forum"

[[ops.items]]
title = "아침형 인간 vs 저녁형 인간, 어느 쪽이세요?"
body_md = """
일찍 일어나야 하루가 길다는 말도 있고, 밤에 집중이 더 잘된다는 사람도 많죠.

저는 저녁형인데 요즘 아침형으로 바꿔 보려고 애쓰는 중입니다. 여러분은 어느 쪽이고, 바꿔 보신 적 있나요?
"""

[[ops.items]]
title = "종이책과 전자책, 뭐가 더 좋으세요?"
body_md = """
전자책은 가볍고 어디서든 읽기 좋은데, 종이책은 넘기는 맛이 있죠.

각자 쓰는 쪽과 이유를 이야기해 봐요. 서로 다른 의견도 편하게 남겨 주세요.
"""

[[ops.items]]
title = "재택근무와 출근, 어떤 방식이 맞나요?"
body_md = """
일하는 방식이 다양해지면서 재택과 출근 사이에서 고민하는 분이 많은 것 같아요.

집중, 소통, 생활 리듬 같은 기준으로 각자 경험을 나눠 주세요. 서로의 상황을 존중하며 이야기해요.
"""

[[ops]]
op = "posts.ensure"
board = "photo"

[[ops.items]]
title = "출근길 하늘"
image = "city"
alt = "도시 하늘 예시 그림"
body_md = """
오늘 아침 하늘이 유난히 맑았어요.
"""

[[ops.items]]
title = "주말 등산 다녀왔어요"
image = "landscape"
alt = "산 풍경 예시 그림"
body_md = """
정상에서 내려다본 풍경입니다. 힘들었지만 올라간 보람이 있네요.
"""

[[ops.items]]
title = "집에서 만든 파스타"
image = "food"
alt = "파스타 예시 그림"
body_md = """
처음 만들어 본 크림 파스타입니다. 생각보다 그럴듯하게 나왔어요.
"""

[[ops.items]]
title = "새로 꾸민 방 한쪽"
image = "room"
alt = "방 예시 그림"
body_md = """
작은 선반 하나 들였더니 방 분위기가 달라졌어요.
"""

[[ops.items]]
title = "카페 창가에서"
image = "still"
alt = "커피잔 예시 그림"
body_md = """
비 오는 날 창가 자리에서 마신 커피 한 잔.
"""

[[ops.items]]
title = "모임에서 다 같이"
image = "people"
alt = "사람들 예시 그림"
body_md = """
지난 번개 모임 사진이에요. 다들 즐거웠습니다.
"""

[[ops]]
op = "posts.ensure"
board = "event"

[[ops.items]]
title = "연말 맞이 사진 올리기 이벤트"
image = "abstract"
alt = "이벤트 예시 그림"
meta = { kind = "giveaway", starts = "2026-11-16", deadline = "2026-12-15" }
body_md = """
올 한 해 가장 기억에 남는 사진을 [사진](/b/photo) 게시판에 올리고 이 글에 댓글로 알려 주세요.

추첨으로 다섯 분께 작은 선물을 드립니다. 당첨자는 공지사항으로 알려 드립니다.
"""

[[ops.items]]
title = "정보·팁 게시판 글쓰기 이벤트"
image = "desk"
alt = "글쓰기 이벤트 예시 그림"
meta = { kind = "review", starts = "2026-11-09", deadline = "2026-11-30" }
body_md = """
생활에 도움이 된 요령을 [정보·팁](/b/tips) 게시판에 써 주세요. 회원 추천을 많이 받은 글 세 편을 골라 선물을 드립니다.

다른 곳의 글을 그대로 옮긴 글은 고르지 않습니다.
"""

[[ops.items]]
title = "새해 첫 퀴즈: 커뮤니티 생일 맞히기"
image = "abstract"
alt = "퀴즈 예시 그림"
meta = { kind = "quiz", starts = "2027-01-02", deadline = "2027-01-10" }
body_md = """
우리 커뮤니티가 처음 문을 연 날은 언제일까요? 정답을 댓글로 남겨 주세요.

맞힌 분 중 추첨으로 세 분께 선물을 드립니다.
"""

[[ops.items]]
title = "가을 출석 이벤트 (마감)"
image = "landscape"
alt = "가을 풍경 예시 그림"
meta = { kind = "etc", starts = "2026-10-01", deadline = "2026-10-31" }
body_md = """
가을 출석 이벤트가 끝났습니다. 함께해 주신 모든 분께 고맙습니다.

당첨자는 공지사항에서 확인해 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "market"

[[ops.items]]
title = "접이식 캠핑 의자 두 개 팝니다"
image = "still"
alt = "캠핑 의자 예시 그림"
meta = { deal = "sell", status = "open", price = "30,000원", place = "직거래, 택배 가능" }
body_md = """
몇 번 안 쓴 접이식 캠핑 의자 두 개입니다. 흠집 거의 없고 가방도 같이 드려요.

택배로 보내면 택배비는 따로입니다.
"""

[[ops.items]]
title = "아이 그림책 나눔합니다"
image = "desk"
alt = "그림책 예시 그림"
meta = { deal = "free", status = "reserved", price = "0원", place = "직거래" }
body_md = """
아이가 커서 안 보는 그림책 열 권 정도 나눔합니다. 직접 가져가실 분만 연락 주세요.

지금은 예약 중이고, 거래가 안 되면 다음 분께 연락드릴게요.
"""

[[ops.items]]
title = "중고 전기 주전자 삽니다"
meta = { deal = "buy", status = "open", price = "15,000원 안쪽", place = "택배" }
body_md = """
작은 전기 주전자를 찾고 있어요. 잘 작동하고 안쪽이 깨끗하면 좋겠습니다.

사진과 가격 남겨 주세요.
"""

[[ops.items]]
title = "책상 스탠드 팝니다 (거래 완료)"
image = "room"
alt = "스탠드 예시 그림"
meta = { deal = "sell", status = "done", price = "12,000원", place = "직거래" }
body_md = """
거래가 끝났습니다. 관심 가져 주셔서 고맙습니다.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "커뮤니티 이용 규칙"
notice = true
body_md = """
모두가 편하게 이야기할 수 있도록 몇 가지 규칙을 지켜 주세요.

1. 서로 존중하는 말을 씁니다
2. 광고, 도배, 같은 글 반복은 지웁니다
3. 다른 사람의 개인정보를 올리지 않습니다

규칙을 여러 번 어기면 글쓰기가 제한될 수 있습니다.
"""

[[ops.items]]
title = "장터 이용 안내"
notice = true
body_md = """
[장터](/b/market)에서는 회원끼리 물건을 사고팔거나 나눔할 수 있습니다.

- 거래 상태(거래 중, 예약 중, 거래 완료)를 꼭 바꿔 주세요
- 먼저 돈을 보내 달라는 거래는 조심하세요

거래 중 생긴 문제는 당사자끼리 해결해야 합니다.
"""

[[ops.items]]
title = "커뮤니티를 열었습니다"
body_md = """
반갑습니다. 사는 이야기, 궁금한 것, 알면 좋은 정보를 편하게 나누는 곳입니다.

처음 오셨다면 [자유게시판](/b/free)에 인사 한마디 남겨 주세요.
"""
