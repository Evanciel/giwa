# 쇼핑몰 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 상품명·가격은 예시다.

[[ops]]
op = "posts.ensure"
board = "products"

[[ops.items]]
title = "린넨 셔츠 오트밀"
image = "still"
alt = "린넨 셔츠 예시 그림"
meta = { category = "new", price = "49,000원" }
body_md = """
가볍고 바람이 잘 통하는 린넨 셔츠입니다. 한 번 빨아 두면 결이 부드러워집니다.

- 소재: 린넨 100%
- 크기: S, M, L
- 세탁: 찬물 손빨래, 그늘에 말리기

입어 보신 분들이 많이 고르는 크기는 평소 크기 그대로입니다.
"""

[[ops.items]]
title = "핸드드립 원두 200g"
image = "food"
alt = "원두 예시 그림"
meta = { category = "best", price = "16,000원" }
body_md = """
주문을 받은 뒤 볶아 보내는 원두입니다. 견과류와 초콜릿 향이 나고 산미가 적습니다.

볶은 날짜를 봉투에 적어 보내 드립니다. 받은 뒤 2주 안에 드시면 가장 맛있습니다.
"""

[[ops.items]]
title = "도자기 머그 두 개 세트"
image = "still"
alt = "머그 세트 예시 그림"
meta = { category = "set", price = "38,000원" }
body_md = """
손으로 빚어 굽는 머그 두 개를 상자에 담았습니다. 굽는 동안 유약이 흘러 하나하나 무늬가 조금씩 다릅니다.

선물 포장과 짧은 손글씨 카드를 무료로 넣어 드립니다. 주문할 때 카드 문구를 남겨 주세요.
"""

[[ops.items]]
title = "면 에코백 큰 크기"
image = "abstract"
alt = "에코백 예시 그림"
meta = { category = "sale", price = "18,000원 → 12,000원" }
body_md = """
노트북과 장바구니가 함께 들어가는 넉넉한 크기입니다. 안쪽에 작은 주머니가 있습니다.

이번 철 남은 수량만 값을 내려 드립니다.
"""

[[ops.items]]
title = "향초 우드 세이지"
image = "room"
alt = "향초 예시 그림"
meta = { category = "new", price = "26,000원" }
body_md = """
콩기름으로 만든 향초입니다. 나무와 허브 향이 은은하게 퍼집니다.

- 타는 시간: 약 40시간
- 처음 켤 때는 겉면이 고르게 녹을 때까지 두 시간쯤 켜 두세요.
"""

[[ops.items]]
title = "티 타월 세 장 묶음"
image = "abstract"
alt = "티 타월 예시 그림"
meta = { category = "best", price = "21,000원", soldout = true }
body_md = """
물을 잘 먹는 면 티 타월 세 장입니다. 그릇을 닦거나 빵 바구니 덮개로 쓰기 좋습니다.

지금은 품절입니다. 다시 들어오면 공지로 알려 드립니다.
"""

[[ops.items]]
title = "계절 선물 상자"
image = "still"
alt = "선물 상자 예시 그림"
meta = { category = "set", price = "55,000원" }
body_md = """
원두, 머그, 향초를 한 상자에 담은 선물 세트입니다. 받는 분 주소로 바로 보내 드립니다.

명절에는 주문이 몰려 보내는 날이 하루 이틀 늦어질 수 있습니다.
"""

[[ops.items]]
title = "유리 물병 1L"
image = "abstract"
alt = "유리 물병 예시 그림"
meta = { category = "sale", price = "15,000원 → 11,000원" }
body_md = """
뜨거운 차를 담아도 되는 내열 유리 물병입니다. 뚜껑을 빼고 통째로 씻을 수 있습니다.
"""

[[ops]]
op = "posts.ensure"
board = "stories"

[[ops.items]]
title = "원두를 볶는 아침"
image = "desk"
body_md = """
주문은 전날 저녁에 마감하고, 다음 날 아침 일찍 그날 보낼 만큼만 볶습니다.

볶은 원두는 하룻밤 가스를 빼고 봉투에 담습니다. 그래서 받는 날이 볶은 날에서 하루나 이틀 뒤가 됩니다.
"""

[[ops.items]]
title = "이번 철 새로 들인 물건들"
image = "room"
body_md = """
날이 따뜻해져 가벼운 소재를 골랐습니다. 린넨 셔츠와 큰 에코백을 새로 들였습니다.

## 고른 까닭

오래 쓰고, 빨수록 좋아지는 물건을 고르려고 합니다. 이번에도 직접 한 달씩 써 본 것만 올렸습니다.
"""

[[ops.items]]
title = "포장하는 날"
image = "still"
body_md = """
선물 상자는 모두 손으로 포장합니다. 종이 완충재만 쓰고 비닐 테이프는 쓰지 않습니다.

받은 상자는 분리배출할 때 종이로 버리시면 됩니다.
"""

[[ops]]
op = "posts.ensure"
board = "reviews"

[[ops.items]]
title = "예시 후기: 선물로 보냈는데 포장이 꼼꼼했어요"
image = "still"
body_md = """
후기 게시판에 이렇게 사진과 함께 글이 올라옵니다. 이 글은 예시라 실제 구매 후기가 아닙니다.

회원이 후기를 쓰면 이 자리에 보입니다.
"""

[[ops.items]]
title = "예시 후기: 원두 향이 좋아요"
image = "food"
body_md = """
예시 후기입니다. 구매한 분이 쓴 글이 쌓이면 첫 화면에도 최근 후기가 보입니다.
"""

[[ops.items]]
title = "예시 후기: 크기가 딱 맞았어요"
body_md = """
사진 없이 글만 올린 후기는 이렇게 보입니다. 예시 글이니 지우거나 고쳐 써 주세요.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "가게를 열었습니다"
notice = true
body_md = """
작은 온라인 가게를 열었습니다. 오래 쓰는 생활 물건을 골라 소개합니다.

주문과 배송은 [주문·배송 안내](/p/guide)를, 궁금한 점은 [문의](/p/contact)를 이용해 주세요.
"""

[[ops.items]]
title = "명절 배송 일정 안내"
body_md = """
명절 연휴에는 택배사가 쉬어 보내는 날이 달라집니다.

- 연휴 전 마지막 발송: 연휴 시작 이틀 전
- 연휴 뒤 첫 발송: 연휴가 끝난 다음 날

연휴 중 주문은 순서대로 보내 드립니다.
"""

[[ops.items]]
title = "티 타월이 품절되었습니다"
body_md = """
찾는 분이 많아 티 타월 세 장 묶음이 품절되었습니다. 다음 달 중순에 다시 들어올 예정입니다.
"""
