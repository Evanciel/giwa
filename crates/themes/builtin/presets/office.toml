# 전문 사무소 (ADR-0139). 법률·세무·노무·회계·특허 사무소처럼 업무 분야, 구성원, 칼럼, 상담 신청이 중심이다.
# 변호사·세무사 등은 직역마다 광고 규정이 있어 승소율·성공률 같은 성과 숫자와 후기를 두지 않는다. 글자는 예시다.
id = "office"
name = "전문 사무소"
description = "업무 분야, 구성원 소개, 상담 절차, 칼럼·소식, 상담 신청(분야 고르기), 오시는 길"
theme_note = "짙은 먹색 남색에 각진 작은 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fbfbfa", fg = "#181b21", primary = "#2c3d58", muted = "#575c66", surface = "#ffffff", border = "#e2e3e6" }, color_dark = { bg = "#121418", fg = "#e9ebef", primary = "#a9bad6", muted = "#a2a7b1", surface = "#191c22", border = "#2c3038" }, radius = { sm = 2, md = 4, lg = 6 }, layout = { max_width = 1160 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "column"
name = "칼럼"
kind = "blog"
layout = "webzine"
sort_order = 0
policy = { write = "editor", comment = "none" }
field_schema = [
  { key = "area", label = "분야", type = "select", list = true, filter = true, options = [{ value = "a", label = "업무 분야 하나" }, { value = "b", label = "업무 분야 둘" }, { value = "c", label = "업무 분야 셋" }] },
]

[[ops]]
op = "board.ensure"
slug = "notice"
name = "소식"
kind = "notice"
sort_order = 1

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "practice"
title = "업무 분야"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "people"
title = "구성원"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "consult"
title = "상담 신청"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "상담 분야와 진행 절차, 상담 예약 방법을 안내하는 사무소입니다.", home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "업무 분야", link = { kind = "page", slug = "practice" } },
  { label = "구성원", link = { kind = "page", slug = "people" } },
  { label = "칼럼", link = { kind = "board", slug = "column" } },
  { label = "소식", link = { kind = "board", slug = "notice" } },
  { label = "상담 신청", link = { kind = "page", slug = "consult" } },
]

