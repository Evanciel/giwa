name: release

# 태그를 밀면 대상마다 빌드하고 SHA256SUMS 와 함께 릴리스를 만든다 (SPEC §12, ADR-0124).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml 의 버전을 rustup 이 자동으로 설치한다
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.zig
        run: |
          python3 -m pip install --user ziglang
          cargo install --locked cargo-zigbuild --version 0.20.1
      - if: matrix.zig
        run: cargo zigbuild --release --locked -p giwa-cli --target ${{ matrix.target }}
      - if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p giwa-cli --target ${{ matrix.target }}
      - name: 낱개 바이너리 (giwa update 가 받는다)
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/giwa$ext" "giwa-${{ matrix.target }}$ext"
      - name: 묶기 (윈도우)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/giwa.exe -DestinationPath giwa-${{ matrix.target }}.zip
      - name: 묶기 (그 밖)
        if: runner.os != 'Windows'
        run: tar -czf giwa-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release giwa
      - uses: actions/upload-artifact@v4
        with:
          name: giwa-${{ matrix.target }}
          path: giwa-${{ matrix.target }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬
        working-directory: dist
        run: |
          sha256sum giwa-* > SHA256SUMS
          printf '%s\n' "${GITHUB_REF_NAME#v}" > VERSION
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
