# 회사 소개 (유형 3, ADR-0126). 글자는 예시다. 에이전트가 회사 정보로 바꾼다.
id = "company"
name = "회사 소개"
description = "첫 인상·숫자·하는 일·행동 유도 첫 화면, 회사 소개·연혁·조직도 페이지, 공지"
theme_note = "깊은 청록에 단정한 작은 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#fcfcfb", fg = "#15202b", primary = "#0f5468", muted = "#55606b", surface = "#ffffff", border = "#e1e5e8" }, color_dark = { bg = "#11171c", fg = "#e8edf1", primary = "#7fc7da", muted = "#9fabb5", surface = "#182027", border = "#2a343c" }, radius = { sm = 4, md = 8, lg = 12 }, layout = { max_width = 1200 } }

[[ops]]
op = "module.ensure"
id = "forms"

[[ops]]
op = "board.ensure"
slug = "notice"
name = "공지"
kind = "notice"
sort_order = 0

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "about"
title = "회사 소개"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "contact"
title = "문의"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "회사 소개", link = { kind = "page", slug = "about" } },
  { label = "공지", link = { kind = "board", slug = "notice" } },
  { label = "문의", link = { kind = "page", slug = "contact" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { eyebrow = "작은 회사의 일을 디지털로 가볍게 바꾸는 서비스 회사", button = { label = "문의하기", link = "/p/contact" }, button2 = { label = "회사 소개", link = "/p/about" } } },
  { kind = "stats", region = "main", scope = "home", config = { tone = "soft", items = [
    { value = "00년", label = "한 분야에서 일한 시간" },
    { value = "000곳", label = "함께 일한 고객사" },
    { value = "00%", label = "다시 찾은 고객 비율" },
  ] } },
  { kind = "features", region = "main", scope = "home", title = "하는 일", config = { style = "bento", items = [
    { title = "업무 시스템 구축", text = "엑셀과 메신저에 흩어진 주문, 재고, 고객 관리를 한곳에 모읍니다. 회사의 일하는 방식에 맞춰 처음부터 함께 만듭니다." },
    { title = "운영 대행", text = "만든 뒤에도 매달 점검하고 필요한 곳을 고쳐 드립니다." },
    { title = "업무 진단", text = "지금 일하는 방식을 살펴보고 먼저 바꿀 곳을 짚어 드립니다." },
    { title = "직원 교육", text = "새 도구에 금방 익숙해지도록 현장에서 함께 써 봅니다." },
  ] } },
  { kind = "features", region = "main", scope = "home", title = "일하는 방식", config = { style = "steps", tone = "soft", items = [
    { title = "상담", text = "무엇이 필요한지 듣습니다." },
    { title = "제안", text = "범위와 비용을 적어 드립니다." },
    { title = "진행", text = "중간 결과를 함께 봅니다." },
    { title = "마무리", text = "운영 방법까지 넘겨 드립니다." },
  ] } },
  { kind = "latest_posts", region = "main", scope = "home", title = "공지", config = { board = "notice", limit = 4 } },
  { kind = "cta", region = "main", scope = "home", title = "어떤 일이든 먼저 이야기해 보세요", config = { text = "연락처와 궁금한 점을 남겨 주시면 영업일 하루 안에 답합니다.", button = { label = "문의하기", link = "/p/contact" } } },
  { kind = "hero", region = "main", scope = "page:contact", config = { title = "문의", text = "연락처와 궁금한 점을 남겨 주세요." } },
  { kind = "contact_form", region = "main", scope = "page:contact", config = { form = "contact", purpose = "문의 답변" } },
  { kind = "hero", region = "main", scope = "page:about", config = { title = "회사 소개", text = "작은 회사도 좋은 도구를 쓸 수 있어야 한다는 생각으로 시작했습니다. 고객의 하루가 조금 더 가벼워지는 일을 계속 하려 합니다." } },
  { kind = "timeline", region = "main", scope = "page:about", title = "연혁", config = { items = [
    { date = "2016년", title = "회사 설립" },
    { date = "2020년", title = "운영 대행 시작", text = "만든 시스템을 꾸준히 돌보는 운영 대행을 새로 열었습니다." },
    { date = "2024년", title = "지금의 사무실로 이전" },
  ] } },
  { kind = "org_chart", region = "main", scope = "page:about", title = "조직도", config = { tone = "soft", nodes = [
    { name = "대표", children = [
      { name = "경영지원팀" },
      { name = "서비스팀", children = [{ name = "기획" }, { name = "운영" }] },
      { name = "개발팀" },
    ] },
  ] } },
  { kind = "visit", region = "main", scope = "page:about", title = "오시는 길", config = { address = "주소를 적어 주세요", phone = "02-000-0000" } },
]
