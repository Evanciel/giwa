# 개인 블로그 예시 글 (ADR-0142). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `maru sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 글 내용은 예시다.

[[ops]]
op = "posts.ensure"
board = "blog"

[[ops.items]]
title = "블로그를 시작합니다"
image = "desk"
alt = "책상 예시 그림"
tags = ["일상", "시작"]
body_md = """
오래 미뤄 두던 블로그를 드디어 열었습니다. 읽은 책, 다녀온 곳, 일하며 배운 것을 천천히 적어 보려고 합니다.

잘 쓰려고 하면 오히려 안 써져서, 일주일에 한 편만 쓰는 것을 목표로 잡았습니다. 짧아도 꾸준히 쓰는 쪽을 고르겠습니다.

이 글은 예시입니다. 고쳐 쓰거나 지우고 첫 글을 올려 보세요.
"""

[[ops.items]]
title = "아침 산책 한 달 해 보니"
image = "landscape"
alt = "산책길 예시 그림"
tags = ["일상", "습관"]
body_md = """
한 달 동안 출근 전에 30분씩 걸었습니다. 처음 일주일은 일어나기가 힘들었는데, 둘째 주부터는 몸이 먼저 깼습니다.

## 달라진 것

- 오전에 머리가 덜 멍합니다
- 동네에 이런 골목이 있었나 싶은 곳을 여럿 찾았습니다
- 비 오는 날 쉬는 것도 계획에 넣으니 오래 갑니다

다음 달에는 걷는 길을 조금 넓혀 보려고 합니다.
"""

[[ops.items]]
title = "이번 달에 읽은 책 세 권"
image = "still"
alt = "책 예시 그림"
tags = ["책"]
body_md = """
이번 달에는 소설 한 권, 에세이 한 권, 일 이야기 책 한 권을 읽었습니다.

소설은 짧은 이야기 여러 편을 묶은 책이라 자기 전에 한 편씩 읽기 좋았습니다. 에세이는 밑줄 친 곳이 많아 다시 펼쳐 볼 생각입니다.

읽은 책은 한 줄 감상과 함께 계속 이 블로그에 남기겠습니다.
"""

[[ops.items]]
title = "작업 책상을 정리했습니다"
image = "room"
alt = "작업 공간 예시 그림"
tags = ["일", "공간"]
body_md = """
책상 위에 쌓아 둔 것을 모두 내리고 꼭 쓰는 것만 다시 올렸습니다. 모니터, 공책, 펜 두 자루, 물컵이 전부입니다.

치우고 나니 앉자마자 일을 시작하기가 쉬워졌습니다. 다음에는 선 정리를 해 볼 생각입니다.
"""

[[ops.items]]
title = "주말에 다녀온 바닷가"
image = "landscape"
alt = "바닷가 예시 그림"
tags = ["여행"]
body_md = """
지난 주말에 기차를 타고 바닷가 마을에 다녀왔습니다. 철이 지나 사람이 적었고, 바람은 차가워도 햇볕이 좋았습니다.

해안을 따라 두 시간쯤 걷고, 작은 식당에서 생선구이를 먹었습니다. 다음에는 하룻밤 묵으면서 해 뜨는 것을 보고 싶습니다.
"""
