# 운동 스튜디오 예시 글 (ADR-0168). 프리셋 연산 뒤에 붙어 빈 게시판에만 한 번 들어간다.
# 운영자가 고쳐 쓰면 그 글은 운영자의 글이 되고, 고치지 않은 예시는 `giwa sample clear --yes` 로 한 번에 지운다.
# 그림은 서버가 사이트 주 색으로 그린다(image = 장면). 수업 내용·일정은 예시다.

[[ops]]
op = "posts.ensure"
board = "news"

[[ops.items]]
title = "아침 기초 반, 호흡부터 다시 잡았어요"
image = "people"
alt = "아침 기초 반 수업 예시 그림"
body_md = """
이번 주 아침 기초 반은 동작보다 호흡을 먼저 연습했습니다. 숨을 들이쉬고 내쉴 때 갈비뼈가 어떻게 움직이는지 손으로 느껴 보는 데서 시작했습니다.

- 누워서 호흡 다섯 번 세기
- 숨에 맞춰 골반 말기
- 오늘 편했던 동작, 불편했던 동작 하나씩 말하기

다음 주에는 오늘 익힌 호흡에 팔 동작을 더합니다.
"""

[[ops.items]]
title = "회복 반을 새로 엽니다"
image = "room"
alt = "회복 반 수업 공간 예시 그림"
body_md = """
허리와 어깨가 자주 불편한 분들을 위해 회복 반을 엽니다. 무리 없는 범위에서 천천히 움직이며, 한 반은 네 명까지만 받습니다.

통증이 심하거나 치료 중이라면 먼저 의사와 상의해 주세요. 체험 신청 때 불편한 곳을 적어 주시면 수업 전에 함께 살펴봅니다.
"""

[[ops.items]]
title = "소도구를 새로 들였습니다"
image = "still"
alt = "새 소도구 예시 그림"
body_md = """
작은 공, 고무 밴드, 폼 롤러를 새로 들였습니다. 그룹 수업에서 동작을 쉽게 하거나 조금 더 어렵게 할 때 씁니다.

쓰고 난 소도구는 제자리 바구니에 넣어 주세요. 개인 수업 회원은 수업 전후에 자유롭게 쓰셔도 됩니다.
"""

[[ops.items]]
title = "석 달 동안 달라진 점을 돌아봤어요"
image = "abstract"
alt = "변화 기록 예시 그림"
body_md = """
석 달째 함께한 저녁 반 회원들과 처음 기록을 다시 꺼내 봤습니다. 처음에는 버거웠던 동작을 이제는 숨을 고르며 끝까지 해내는 분이 많았습니다.

숫자보다 '계단 오르기가 덜 힘들다', '아침에 허리가 덜 뻣뻣하다' 같은 말이 더 반가웠습니다. 다음 기록은 석 달 뒤에 함께 봅니다.
"""

[[ops]]
op = "posts.ensure"
board = "notice"

[[ops.items]]
title = "다음 달 시간표 안내"
notice = true
body_md = """
다음 달 그룹 수업 시간표가 나왔습니다. 평일 저녁 반을 한 타임 늘리고, 토요일 오전 반은 그대로 둡니다.

요일별 시간은 [수업·시간표](/p/classes)에 있습니다. 처음 오시는 분은 [체험 신청](/p/trial)에 원하는 날짜를 남겨 주세요.
"""

[[ops.items]]
title = "수업 예약과 취소 안내"
body_md = """
그룹 수업은 자리가 정해져 있어 미리 예약해 주세요.

- 예약은 수업 전날 밤까지 받습니다
- 취소 기준과 차감 여부는 스튜디오 기준을 적어 주세요
- 늦게 오시면 몸을 덥히는 동작부터 따로 하고 들어오세요

궁금한 점은 수업 전후에 강사에게 물어봐 주세요.
"""

[[ops.items]]
title = "공휴일 휴무 안내"
body_md = """
공휴일에는 모든 수업을 쉽니다. 쉬는 날이 낀 주의 수강권은 기간을 그만큼 늘려 드립니다.

개인 수업은 강사와 따로 날짜를 맞춰 주세요.
"""
