# 포트폴리오 (유형 5, ADR-0126). 작업물은 게시판 글이고 사진이 첫 화면에 모인다. 글자는 예시다.
id = "portfolio"
name = "포트폴리오"
description = "큰 글자 첫 인상, 작업물 사진 바둑판, 소개 페이지"
theme_note = "흑백 대비에 각진 모서리"

[[ops]]
op = "tokens.ensure"
tokens = { color = { bg = "#ffffff", fg = "#111111", primary = "#111111", muted = "#5f5f5f", surface = "#f6f6f4", border = "#e4e4e0" }, color_dark = { bg = "#101010", fg = "#f4f4f2", primary = "#f4f4f2", muted = "#a3a3a0", surface = "#1a1a1a", border = "#2d2d2b" }, radius = { sm = 0, md = 2, lg = 2 }, layout = { max_width = 1320 } }

[[ops]]
op = "board.ensure"
slug = "works"
name = "작업"
kind = "gallery"
layout = "gallery"
sort_order = 0
field_schema = [
  { key = "client", label = "의뢰처", type = "text", list = true },
  { key = "year", label = "연도", type = "number", list = true },
  { key = "role", label = "맡은 일", type = "text" },
  { key = "url", label = "결과물 주소", type = "url" },
]

[[ops]]
op = "page.ensure"
slug = "home"
title = "첫 화면"
layout = "blocks"
publish = true

[[ops]]
op = "page.ensure"
slug = "about"
title = "소개"
layout = "blocks"
publish = true

[[ops]]
op = "settings.ensure"
values = { description = "작업물과 작업 과정, 의뢰 방법을 소개합니다.", home_page = "home", show_search = false }

[[ops]]
op = "menu.ensure"
location = "header"
items = [
  { label = "작업", link = { kind = "board", slug = "works" } },
  { label = "소개", link = { kind = "page", slug = "about" } },
]

[[ops]]
op = "widgets.ensure"
items = [
  { kind = "hero", region = "main", scope = "home", config = { title = "작은 브랜드와 책의 얼굴을 만드는 그래픽 디자이너입니다" } },
  { kind = "gallery_grid", region = "main", scope = "home", config = { board = "works", limit = 12, columns = 3 } },
  { kind = "cta", region = "main", scope = "home", title = "함께 일하고 싶다면", config = { tone = "plain", text = "브랜드, 인쇄물, 누리집 작업 의뢰를 받습니다. 소개 화면을 보시고 편하게 연락 주세요.", button = { label = "소개 보기", link = "/p/about" } } },
  { kind = "hero", region = "main", scope = "page:about", config = { title = "소개", text = "브랜드와 책, 포스터를 디자인해 왔습니다. 쓰는 사람의 손에 오래 남는 단정한 디자인을 좋아합니다." } },
  { kind = "timeline", region = "main", scope = "page:about", title = "경력", config = { items = [
    { date = "2023 ~", title = "지금 하는 일" },
    { date = "2018 ~ 2023", title = "이전에 한 일" },
  ] } },
]
