{# 광고 자리 (ADR-0079). 모든 광고에 「광고」 표시. 애드센스 코드는 화면의 nonce 를 단다. #}
<div class="ad-slot ad-{{ w.data.provider }}">
  <p class="ad-label">{{ "광고"|t }}</p>
  {% if w.data.provider == "adsense" %}
  {% if csp_nonce %}
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ w.data.client }}" crossorigin="anonymous" nonce="{{ csp_nonce }}"></script>
  <ins class="adsbygoogle ad-unit" data-ad-client="{{ w.data.client }}" data-ad-slot="{{ w.data.slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script nonce="{{ csp_nonce }}">(adsbygoogle = window.adsbygoogle || []).push({});</script>
  {% endif %}
  {% else %}
  <a class="ad-house" href="{{ w.data.link }}"{% if w.data.external_link %} rel="noopener noreferrer sponsored"{% else %} rel="sponsored"{% endif %}><img src="{{ w.data.image }}" alt="{{ w.data.alt }}" loading="lazy" decoding="async"></a>
  {% endif %}
</div>
