name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            debug: full
            strip: none
          # Linux 는 디버그 정보를 실행 파일 안에 넣어 시험용 바이너리가 200MB 를 넘는다.
          # e2e_release 가 그 파일을 업데이트 파일로 내려받으므로 디버그 정보를 넣지 않는다.
          # 실패한 assert 의 파일·줄은 디버그 정보 없이도 나온다 (ADR-0174).
          # wasmtime 을 붙인 뒤로는 표준 라이브러리에 딸려 오는 디버그 정보까지 빼야 200MB 안에 든다 (ADR-0179).
          - os: ubuntu-latest
            debug: none
            strip: debuginfo
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.debug }}
      CARGO_PROFILE_DEV_STRIP: ${{ matrix.strip }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml 의 버전을 rustup 이 자동으로 설치한다
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: 품질 게이트
        shell: pwsh
        run: ./scripts/check.ps1

  # 윈도우 릴리스 바이너리 크기가 한도(scripts/size.ps1 기본값) 안인지 본다 (ADR-0176).
  # 미니PC 가 윈도우라 윈도우 크기를 잰다. 릴리스 빌드가 길어 품질 게이트와 따로 돈다.
  release-size:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: 릴리스 크기 검사
        shell: pwsh
        run: ./scripts/size.ps1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit
