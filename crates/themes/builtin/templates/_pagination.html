{% if pagination and pagination.total_pages > 1 %}
<nav class="pagination" aria-label="페이지">
  {% if pagination.prev_url %}<a rel="prev" href="{{ pagination.prev_url }}">이전</a>{% endif %}
  <span>{{ pagination.page }} / {{ pagination.total_pages }}</span>
  {% if pagination.next_url %}<a rel="next" href="{{ pagination.next_url }}">다음</a>{% endif %}
</nav>
{% endif %}
